<title>5C Pulse</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
/* ═══════════════════════════════════════════════════════════════════════
   5C PULSE — standalone build
   Design tokens are the project's own (src/styles/tokens.css). To rebrand,
   change the values in :root here and nowhere else.
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  --navy-900:#1F3864; --navy-800:#274877; --steel-600:#2E5C8A; --steel-300:#A9C0DA;
  --cream-100:#FFF2CC; --cream-ink:#5B4A12;
  --paper:#FAFAFB; --surface:#FFFFFF; --ink:#171A20; --ink-muted:#5D6675;
  --hairline:rgba(31,56,100,.13); --sunken:#F1F3F7;
  --on-target:#1B7A52; --behind:#B7791F; --attention:#A93226; --blocked:#6B4E9E;
  --input:#1155CC;
  --rail:#1F3864; --rail-ink:#FFFFFF; --btn:#1F3864; --btn-ink:#FFFFFF;
  --tint:rgba(46,92,138,.09);
  --font-display:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-data:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --navy-900:#4A72B8; --navy-800:#3E63A8; --steel-600:#6C9AD0; --steel-300:#3B4F6B;
    --cream-100:#3A3320; --cream-ink:#F2DFA6;
    --paper:#0E1421; --surface:#161F2F; --ink:#E9EDF4; --ink-muted:#94A1B6;
    --hairline:rgba(150,178,212,.18); --sunken:#111A28;
    --on-target:#4FBF8B; --behind:#DCA845; --attention:#E97165; --blocked:#AC93D9;
    --input:#84B4FF;
    --rail:#131D30; --rail-ink:#EAF0FA; --btn:#3E63A8; --btn-ink:#FFFFFF;
    --tint:rgba(108,154,208,.14);
  }
}
:root[data-theme="dark"] {
  --navy-900:#4A72B8; --navy-800:#3E63A8; --steel-600:#6C9AD0; --steel-300:#3B4F6B;
  --cream-100:#3A3320; --cream-ink:#F2DFA6;
  --paper:#0E1421; --surface:#161F2F; --ink:#E9EDF4; --ink-muted:#94A1B6;
  --hairline:rgba(150,178,212,.18); --sunken:#111A28;
  --on-target:#4FBF8B; --behind:#DCA845; --attention:#E97165; --blocked:#AC93D9;
  --input:#84B4FF;
  --rail:#131D30; --rail-ink:#EAF0FA; --btn:#3E63A8; --btn-ink:#FFFFFF;
  --tint:rgba(108,154,208,.14);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--font-body); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--font-display); margin:0; text-wrap:balance; letter-spacing:-.02em}
h1{font-size:30px; font-weight:700; line-height:1.15}
h2{font-size:22px; font-weight:600}
h3{font-size:17px; font-weight:600; letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--navy-900); outline-offset:2px; border-radius:6px}
.tab{font-family:var(--font-data); font-variant-numeric:tabular-nums}
.muted{color:var(--ink-muted)}
.s5{font-size:13px} .s6{font-size:11px} .s4{font-size:15px} .s3{font-size:17px}
.up{text-transform:uppercase; letter-spacing:.06em}

/* ── rail ─────────────────────────────────────────────────────────────── */
.rail{
  position:sticky; top:0; z-index:40; height:56px; background:var(--rail); color:var(--rail-ink);
  display:flex; align-items:center; gap:14px; padding:0 16px;
}
.rail .wrap{max-width:1280px; margin:0 auto; width:100%; display:flex; align-items:center; gap:14px}
.mark{display:flex; align-items:center; gap:9px; flex-shrink:0; text-decoration:none; color:inherit}
.mark b{font-family:var(--font-display); font-weight:600; font-size:15px; letter-spacing:-.02em}
nav.tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  background:none; border:0; color:color-mix(in srgb, var(--rail-ink) 72%, transparent);
  padding:6px 10px; border-radius:6px; font-size:13px; font-weight:500; cursor:pointer;
  white-space:nowrap; transition:background .13s, color .13s;
}
nav.tabs button:hover{background:color-mix(in srgb, var(--rail-ink) 12%, transparent); color:var(--rail-ink)}
nav.tabs button[aria-current="page"]{background:color-mix(in srgb, var(--rail-ink) 18%, transparent); color:var(--rail-ink)}
.railright{margin-left:auto; display:flex; align-items:center; gap:10px; flex-shrink:0}
.calib{border:1px solid color-mix(in srgb, var(--rail-ink) 34%, transparent); border-radius:6px;
  padding:2px 7px; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
  color:color-mix(in srgb, var(--rail-ink) 82%, transparent)}
.who{display:flex; align-items:center; gap:7px; background:color-mix(in srgb, var(--rail-ink) 13%, transparent);
  border:0; border-radius:6px; padding:5px 9px; cursor:pointer; color:inherit; font-size:13px}
.avatar{width:24px; height:24px; border-radius:50%; display:grid; place-items:center;
  background:color-mix(in srgb, var(--rail-ink) 22%, transparent); font-size:10px; font-weight:700}

main{max-width:1280px; margin:0 auto; padding:22px 16px 80px}
.stack{display:flex; flex-direction:column; gap:18px}
.row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.between{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; flex-wrap:wrap}

/* ── surfaces ─────────────────────────────────────────────────────────── */
.card{background:var(--surface); border:1px solid var(--hairline); border-radius:10px}
.card>header{padding:12px 16px; border-bottom:1px solid var(--hairline);
  display:flex; align-items:center; justify-content:space-between; gap:10px}
.card>.body{padding:16px}
.card>.body.flush{padding:0}
.list{list-style:none; margin:0; padding:0}
.list>li{padding:11px 16px; border-top:1px solid var(--hairline); display:flex; align-items:center; gap:12px}
.list>li:first-child{border-top:0}
.empty{padding:38px 16px; text-align:center}
.empty p:first-child{font-size:15px}

/* ── controls ─────────────────────────────────────────────────────────── */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px; cursor:pointer;
  border-radius:6px; border:1px solid transparent; background:var(--btn); color:var(--btn-ink);
  font-size:15px; font-weight:500; padding:0 16px; height:40px; transition:filter .13s, background .13s;
}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.42; cursor:not-allowed; filter:none}
.btn.sm{height:32px; padding:0 11px; font-size:13px}
.btn.lg{height:48px; font-size:15px; width:100%}
.btn.sec{background:var(--surface); color:var(--ink); border-color:var(--hairline)}
.btn.sec:hover{background:var(--sunken); filter:none}
.btn.ghost{background:none; color:var(--ink-muted); border-color:transparent}
.btn.ghost:hover{background:var(--sunken); color:var(--ink); filter:none}
.btn.danger{background:var(--surface); color:var(--attention); border-color:color-mix(in srgb,var(--attention) 40%,transparent)}
.btn.danger:hover{background:color-mix(in srgb,var(--attention) 9%,transparent); filter:none}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=month],select,textarea{
  width:100%; background:var(--surface); border:1px solid var(--hairline); border-radius:6px;
  padding:0 11px; height:40px; font-size:15px;
}
textarea{padding:9px 11px; height:auto; min-height:74px; resize:vertical; line-height:1.45}
label.fld{display:block}
label.fld>span{display:block; font-size:13px; font-weight:500; color:var(--input); margin-bottom:5px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}

/* the ONE cream control cell per screen */
.control{display:inline-flex; align-items:center; gap:10px; background:var(--cream-100);
  color:var(--cream-ink); border:1px solid var(--hairline); border-radius:6px; padding:8px 12px; flex-wrap:wrap}
.control input,.control select{height:32px; font-size:13px; width:auto; background:var(--surface); color:var(--ink)}
.control label{font-size:13px; font-weight:600}

/* guard note — amber, inline, never a blocking dialog */
.guard{display:flex; gap:9px; align-items:flex-start; border:1px solid color-mix(in srgb,var(--behind) 42%,transparent);
  background:color-mix(in srgb,var(--behind) 8%,transparent); color:var(--behind);
  border-radius:6px; padding:10px 12px; font-size:13px}
.guard b{color:var(--behind)}
.guard ul{margin:5px 0 0; padding-left:17px}
.guard button.fix{background:none;border:0;padding:0;margin-top:5px;color:inherit;
  font-weight:600;text-decoration:underline;cursor:pointer;font-size:13px}
.note{border-radius:6px; padding:9px 12px; font-size:13px; background:var(--tint); color:var(--steel-600)}

/* ── status marks: shape + label, never colour alone ──────────────────── */
.pill{display:inline-flex; align-items:center; gap:5px; border:1px solid; border-radius:6px;
  background:var(--surface); padding:2px 7px; font-size:11px; font-weight:600; white-space:nowrap}
.flag{display:inline-flex; border:1px solid; border-radius:6px; background:var(--surface);
  padding:2px 7px; font-size:11px; font-weight:700; white-space:nowrap}
.c-ontrack,.c-completed{color:var(--on-target); border-color:color-mix(in srgb,var(--on-target) 42%,transparent)}
.c-atrisk,.c-duesoon{color:var(--behind); border-color:color-mix(in srgb,var(--behind) 45%,transparent)}
.c-blocked{color:var(--blocked); border-color:color-mix(in srgb,var(--blocked) 45%,transparent)}
.c-overdue{color:var(--attention); border-color:color-mix(in srgb,var(--attention) 45%,transparent)}
.c-idle{color:var(--ink-muted); border-color:var(--steel-300)}
.c-await{color:var(--steel-600); border-color:var(--steel-300)}
.prio{font-family:var(--font-data); font-size:11px; font-weight:700; text-decoration:none}
.p1{color:var(--attention)} .p2{color:var(--steel-600)} .p3{color:var(--ink-muted)}
.dot{width:8px; height:8px; border-radius:50%; flex-shrink:0}

/* ── tables ───────────────────────────────────────────────────────────── */
.scroll{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:13px}
thead th{background:var(--steel-600); color:#fff; text-align:left; font-weight:600; padding:8px 11px; white-space:nowrap}
tbody td{padding:0 11px; height:36px; border-top:1px solid var(--hairline); white-space:nowrap}
tbody tr:hover{background:var(--sunken)}
td.num,th.num{text-align:right; font-family:var(--font-data); font-variant-numeric:tabular-nums}
tr.total{background:var(--sunken); font-weight:700}
tr.total td{border-top:2px solid var(--hairline)}

/* ── five rings ───────────────────────────────────────────────────────── */
.rings{position:relative; display:inline-grid; place-items:center}
.rings .mid{position:absolute; text-align:center; pointer-events:none}
.rings .mid b{font-family:var(--font-display); font-weight:700; font-size:22px; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.rings .mid span{display:block; font-size:11px; color:var(--ink-muted)}
@keyframes draw{from{stroke-dashoffset:var(--circ)}}
.arc{animation:draw 600ms cubic-bezier(.32,.72,.35,1) both; animation-delay:var(--delay)}
.legend{display:flex; gap:11px; font-size:11px; color:var(--ink-muted); flex-wrap:wrap; justify-content:center}
.legend i{font-style:normal; display:inline-flex; align-items:center; gap:4px}
.legend i::before{content:""; width:7px; height:7px; border-radius:2px; background:currentColor}

/* ── day close ────────────────────────────────────────────────────────── */
.tick{display:flex; gap:11px; align-items:flex-start; width:100%; background:none; border:0;
  padding:9px 6px; border-radius:6px; cursor:pointer; text-align:left}
.tick:hover{background:var(--sunken)}
.box{width:24px; height:24px; border-radius:50%; border:1.5px solid var(--steel-300);
  display:grid; place-items:center; flex-shrink:0; margin-top:1px; font-size:13px; transition:.13s}
.tick[aria-checked="true"] .box{background:var(--on-target); border-color:var(--on-target); color:#fff}
.tick[aria-checked="true"] .tt{color:var(--ink-muted); text-decoration:line-through}
.seg{display:inline-flex; gap:4px; flex-wrap:wrap}
.seg button{background:var(--surface); border:1px solid var(--hairline); color:var(--ink-muted);
  border-radius:6px; padding:4px 9px; font-size:11px; font-weight:600; cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--btn); border-color:var(--btn); color:var(--btn-ink)}
.seg button.ok[aria-pressed="true"]{background:var(--on-target); border-color:var(--on-target)}
.seg button.warn[aria-pressed="true"]{background:var(--behind); border-color:var(--behind)}
.step{display:flex; align-items:center; gap:12px}
.step b{font-family:var(--font-display); font-size:22px; width:56px; text-align:center;
  font-variant-numeric:tabular-nums}
.stepno{color:var(--ink-muted); margin-right:7px; font-weight:400}
.bignum{height:56px; width:140px; font-size:30px; font-weight:700; font-family:var(--font-display);
  font-variant-numeric:tabular-nums; letter-spacing:-.02em}

/* ── people picker (assign) ───────────────────────────────────────────── */
.picker{max-height:230px; overflow-y:auto; border:1px solid var(--hairline); border-radius:6px; padding:4px}
.cand{display:flex; align-items:center; gap:11px; width:100%; background:none; border:0;
  padding:8px 10px; border-radius:6px; cursor:pointer; text-align:left; color:inherit}
.cand:hover{background:var(--sunken)}
.cand[aria-pressed="true"]{background:var(--btn); color:var(--btn-ink)}
.cand[aria-pressed="true"] .muted{color:color-mix(in srgb,var(--btn-ink) 74%, transparent)}
.load{width:62px; height:6px; border-radius:3px; background:color-mix(in srgb,var(--ink) 12%,transparent);
  overflow:hidden; flex-shrink:0}
.load i{display:block; height:100%; background:var(--steel-600); border-radius:3px}
.cand[aria-pressed="true"] .load i{background:color-mix(in srgb,var(--btn-ink) 80%,transparent)}

/* ── misc ─────────────────────────────────────────────────────────────── */
.sheet{position:fixed; inset:0; background:color-mix(in srgb, #0A0E16 62%, transparent);
  display:grid; place-items:center; padding:16px; z-index:60}
.sheet .card{max-width:520px; width:100%; max-height:86vh; overflow-y:auto; box-shadow:0 18px 50px rgba(6,12,24,.34)}
.chips{display:flex; gap:7px; flex-wrap:wrap}
.chip{border:1px solid var(--hairline); background:var(--surface); color:var(--ink-muted);
  border-radius:6px; padding:4px 9px; font-size:11px; cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--steel-600); background:var(--tint); color:var(--steel-600)}
.cap{background:var(--tint); color:var(--steel-600); border-radius:5px; padding:1px 6px; font-size:11px; margin-right:4px}
.bar{width:4px; align-self:stretch; border-radius:3px; flex-shrink:0}
.kudos{background:color-mix(in srgb,var(--behind) 12%,transparent); border-radius:6px; padding:9px 12px; font-size:13px}
.toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:80;
  background:var(--ink); color:var(--paper); border-radius:8px; padding:10px 16px; font-size:13px;
  box-shadow:0 8px 26px rgba(6,12,24,.3)}
details.audit summary{cursor:pointer; padding:11px 16px; font-size:13px; color:var(--ink-muted)}
.ol{margin:0; padding-left:19px; font-size:13px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important}
  .arc{animation:none}
}
</style>

<div class="rail">
  <div class="wrap">
    <a class="mark" href="#" onclick="go('my-day');return false" aria-label="5C Pulse">
      <svg width="22" height="22" viewBox="0 0 28 28" aria-hidden="true">
        <circle cx="14" cy="14" r="12" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>
        <circle cx="14" cy="14" r="9.5" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".82"/>
        <circle cx="14" cy="14" r="7" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".64"/>
        <circle cx="14" cy="14" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".46"/>
        <circle cx="14" cy="14" r="2" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".3"/>
      </svg>
      <b>5C Pulse</b>
    </a>
    <nav class="tabs" id="tabs" aria-label="Primary"></nav>
    <div class="railright">
      <span class="calib" id="calib" hidden>Calibrating</span>

    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   5C PULSE — single-file build.
   Same data, same formulas, same rules as the Next.js + Supabase app in this
   repository. Storage is this browser's localStorage: one device, no server,
   no real auth — you pick who you are, and every permission rule is then
   applied to that person exactly as the database would.
   ══════════════════════════════════════════════════════════════════════════ */

/* ── time: server time is the only truth. Here that means one clock, IST. ── */
const IST = 330;
const nowLocal = () => new Date(Date.now() + IST * 60000);
const todayISO = () => nowLocal().toISOString().slice(0, 10);
const minutesNow = () => { const d = nowLocal(); return d.getUTCHours() * 60 + d.getUTCMinutes(); };
const isoDow = iso => ((new Date(iso + 'T00:00:00Z').getUTCDay() + 6) % 7) + 1;
const addDays = (iso, n) => new Date(new Date(iso + 'T00:00:00Z').getTime() + n * 86400000).toISOString().slice(0, 10);
const weekStart = iso => addDays(iso, -(isoDow(iso) - 1));
const monthOf = iso => iso.slice(0, 7);
const daysLeft = dueISO => Math.round(
  (new Date(dueISO.slice(0, 10) + 'T00:00:00Z') - new Date(todayISO() + 'T00:00:00Z')) / 86400000);
const fmtDay = iso => new Date(iso + 'T00:00:00Z')
  .toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
const fmtShort = iso => new Date(iso.slice(0, 10) + 'T00:00:00Z')
  .toLocaleDateString('en-IN', { day: 'numeric', month: 'short', timeZone: 'UTC' });
const dowName = iso => new Date(iso + 'T00:00:00Z')
  .toLocaleDateString('en-IN', { weekday: 'long', timeZone: 'UTC' });

/* ── the workbook's formulas, live ─────────────────────────────────────── */
function achievementPct(actual, target, direction) {
  if (actual == null || target == null) return null;
  if (direction === 'Lower is better') {          // the workbook's defect, fixed
    if (actual === 0) return 1;                   // never ∞, never divide by zero
    return target / actual;                       // 3 against a target of 0 → 0, i.e. below 100%
  }
  if (target === 0) return null;
  return actual / target;
}
const fixedPct = (done, due) => (!due ? null : done / due);
function taskFlag(dueISO, status) {              // Assigned Tasks · column K, exactly
  if (status === 'Completed' || status === 'Dropped') return 'Closed';
  const left = daysLeft(dueISO);
  if (left < 0) return 'OVERDUE';
  if (status === 'Blocked') return 'BLOCKED - needs you';
  if (left <= 2) return 'Due soon';
  return '';
}
const isOverdue = (dueISO, status) =>
  !['Completed', 'Dropped', 'Declined', 'Missed'].includes(status) && daysLeft(dueISO) < 0;
const weeklyTarget = (d, type, wd) => (type === 'Volume' ? d * wd : d);
const monthlyTarget = (d, type, wd) => (type === 'Volume' ? d * wd : d);
function weeklyStatus(days, ach) {               // Weekly Rollup · column L
  if (days === 0) return 'No submissions';
  if (ach == null) return 'Awaiting data';
  if (ach >= 1) return 'On target';
  if (ach >= 0.8) return 'Slightly behind';
  return 'Needs attention';
}
function ratingInput(days, ach, fx) {            // Monthly Rollup · column N
  if (days === 0) return 'No data';
  if (ach != null && ach >= 1 && fx != null && fx >= 0.9) return 'Exceeding';
  if (ach != null && ach >= 0.8) return 'Meeting';
  return 'Below - review';
}
function computeRings(i) {
  return {
    closed: i.submitted ? 1 : 0,
    fixed: i.fixedDue > 0 ? Math.min(1, i.fixedDone / i.fixedDue) : 1,
    target: i.achievement == null ? 0 : Math.max(0, Math.min(1, i.achievement)),
    assigned: i.assignedOpen > 0 ? Math.max(0, (i.assignedOpen - i.assignedOverdue) / i.assignedOpen) : 1,
    clear: i.blockersPastSla > 0 ? 0 : 1,
  };
}
function titleSimilarity(a, b) {                 // charter-clash guard, ≥80%
  const grams = s => { const t = s.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
    const m = new Map(); for (let i = 0; i < t.length - 1; i++) m.set(t.slice(i, i + 2), (m.get(t.slice(i, i + 2)) || 0) + 1); return m; };
  const ga = grams(a), gb = grams(b);
  if (!ga.size || !gb.size) return 0;
  let ov = 0, na = 0, nb = 0;
  ga.forEach(n => na += n); gb.forEach(n => nb += n);
  ga.forEach((n, g) => ov += Math.min(n, gb.get(g) || 0));
  return (2 * ov) / (na + nb);
}

/* ── seed: the workbook, imported exactly ──────────────────────────────── */
function seed() {
  const P = (id, code, name, dept, desig, boss, role, caps) =>
    ({ id, code, name, dept, desig, boss, email: name.split(' ')[0].toLowerCase() + '@company.com',

function canAssignTo(actor, target) {
  if (target.status === 'Deactivated') return null;
  if (actor.id === target.id) return 'Direct';
  if (isOwner(actor)) return 'Direct';
  if (actor.role === 'Observer') return null;
  if (manages(target.id, actor.id)) return 'Ask';
  if (actor.role === 'Restricted') return null;
  if (actor.dept === target.dept) {
    if (actor.role === 'Department Head') return 'Direct';
    if (manages(actor.id, target.id)) return 'Direct';
    return 'Peer Request';
  }
  return 'Cross-department Request';
}
function canViewTask(actor, t) {
  if (isOwner(actor)) return true;
  if ([t.owner, t.accountable, t.by].includes(actor.id)) return true;
  if (t.pendingWith === actor.id) return true;
  if ((t.supports || []).some(s => s.person === actor.id)) return true;
  if (actor.role === 'Observer') return false;
  if (t.visibility === 'Private') return false;
  if (actor.role === 'Restricted') return false;

  const dow = isoDow(iso), day = Number(iso.slice(8, 10));
  const lastOfMonth = new Date(Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7), 0)).getUTCDate();
  return ch.duties.filter(d => {
    if (!d.active) return false;
    if (d.cadence === 'Daily') return true;
    if (d.cadence === 'Weekly' || d.cadence === 'Fortnightly') return (d.mask || [1]).includes(dow);
    if (d.cadence === 'Monthly' || d.cadence === 'Quarterly') {
      let target = Math.min(d.monthDay || 1, lastOfMonth);

}

/* ── rollup (COUNTIFS / SUMIFS parity) ─────────────────────────────────── */
function buildRollup(people, closes, expectedDays) {
  const rows = people.map(p => {
    const mine = closes.filter(c => c.person === p.id);
    const days = mine.length;
    const onTime = mine.filter(c => c.onTime).length;
    const fD = mine.reduce((s, c) => s + c.fixedDue, 0);
    const fN = mine.reduce((s, c) => s + c.fixedDone, 0);
    const tgt = mine.reduce((s, c) => s + (c.target || 0), 0);
    const act = mine.reduce((s, c) => s + (c.actual || 0), 0);
    const dir = (mine.find(c => c.dir) || {}).dir || 'Higher is better';
    const ach = days === 0 ? null : achievementPct(act, tgt, dir);
    const fx = fixedPct(fN, fD);
    return { id: p.id, name: p.name, dept: p.dept, days,
      rate: expectedDays ? days / expectedDays : null,
      onTimeRate: days === 0 ? null : onTime / days,
      fD, fN, fx, tgt, act, ach, status: weeklyStatus(days, ach),
      reactive: mine.reduce((s, c) => s + c.reactive, 0),
      blockers: mine.filter(c => c.blocker).length,
      rating: ratingInput(days, ach, fx) };
  });
  const total = {
    days: rows.reduce((s, r) => s + r.days, 0),
    fD: rows.reduce((s, r) => s + r.fD, 0), fN: rows.reduce((s, r) => s + r.fN, 0),
    tgt: rows.reduce((s, r) => s + r.tgt, 0), act: rows.reduce((s, r) => s + r.act, 0),
    reactive: rows.reduce((s, r) => s + r.reactive, 0),
    blockers: rows.reduce((s, r) => s + r.blockers, 0),
  };
  total.fx = fixedPct(total.fN, total.fD);
  // team total keeps the workbook's flat division (mixed directions)
  total.ach = total.tgt === 0 ? null : total.act / total.tgt;
  const flags = {
    blockers: closes.filter(c => c.blocker).length,
    notReviewed: closes.filter(c => !c.reviewed).length,
    late: closes.filter(c => !c.onTime).length,
    reactive: closes.reduce((s, c) => s + c.reactive, 0),
    atRisk: closes.reduce((s, c) => s + c.atRisk, 0),
  };
  return { rows, total, flags };
}

/* ── §6.4 guards, fired at the moment of assigning ─────────────────────── */
function runGuards(target, input, verb) {
  const w = [];
  const dueDate = input.due.slice(0, 10);
  const p1s = S.tasks.filter(t => t.owner === target.id && t.priority === 'P1 - Critical' &&
    !['Completed','Dropped','Declined','Missed'].includes(t.status));
  if (input.priority === 'P1 - Critical' && p1s.length >= target.wip)
    w.push({ code:'overload', msg:`${first(target.id)} already holds ${p1s.length} critical tasks due this week. Assign anyway?`, detail:p1s });
  if (input.est) {
    const sameDay = S.tasks.filter(t => t.owner === target.id && t.due.slice(0,10) === dueDate &&
      !['Completed','Dropped','Declined','Missed'].includes(t.status))
      .reduce((s, t) => s + (t.est || 0), 0);
    const tot = sameDay + Number(input.est);
    if (tot > target.capacity)
      w.push({ code:'capacity', msg:`This puts ${first(target.id)} at ${tot % 1 ? tot.toFixed(1) : tot} hours on ${dowName(dueDate)}.` });
  }
  const ch = S.charters[target.id];
  if (ch) { const hit = ch.duties.find(d => d.active && titleSimilarity(d.title, input.title) >= 0.8);
    if (hit) w.push({ code:'charter_clash', msg:`This is already fixed work in ${first(target.id)}'s charter ("${hit.title}"). Assign as a one-off anyway?` }); }
  if (!isWorkingDay(dueDate)) {
    let nx = dueDate; for (let i = 0; i < 7 && !isWorkingDay(nx); i++) nx = addDays(nx, 1);
    w.push({ code:'non_working_day', msg:`${dowName(dueDate)} is not a working day. Due ${dowName(nx)} instead?`, fix:{ due: nx } });
  }
  if (verb === 'Peer Request' && (new Date(input.due + ':00+05:30') - Date.now()) < 24 * 3600000)
    w.push({ code:'same_day_peer', msg:`Due in under 24 hours — this request is marked Urgent and needs ${first(target.id)}'s acceptance.` });
  return w;
}

function slaText(dueISO, resolved) {
  if (resolved) return { text: 'Resolved', cls: 'c-ontrack' };
  const ms = new Date(dueISO) - Date.now(), abs = Math.abs(ms);
  const h = Math.floor(abs / 3600000), m = Math.floor((abs % 3600000) / 60000);
  const t = `${h}h ${String(m).padStart(2, '0')}m`;
  return ms >= 0 ? { text: t + ' left', cls: '' } : { text: t + ' over', cls: 'c-overdue' };
}

      b.escalatedTo = person(b.unblocker).boss || S.people.find(p => p.role === 'Owner').id;

const STATUS_CLS = { 'On Track':'c-ontrack','Completed':'c-ontrack','At Risk':'c-atrisk',
  'Blocked':'c-blocked','Awaiting Acceptance':'c-await','Pending Review':'c-await',
  'Not Started':'c-idle','Declined':'c-idle','Dropped':'c-idle','Missed':'c-idle' };
const STATUS_MARK = { 'On Track':'●','Completed':'✓','At Risk':'◆','Blocked':'■',
  'Awaiting Acceptance':'◔','Pending Review':'◐','Not Started':'○','Declined':'⨯','Dropped':'—','Missed':'·' };

const prioMark = p => `<abbr class="prio ${p.startsWith('P1') ? 'p1' : p.startsWith('P2') ? 'p2' : 'p3'}" title="${esc(p)}" style="text-decoration:none">${p.slice(0, 2)}</abbr>`;
const diagnostic = () => !!S.settings.diagnosticUntil && S.settings.diagnosticUntil >= todayISO();

function ringsSvg(r, centre, size, diag) {
  const stroke = size >= 100 ? 8 : 3.5, gap = size >= 100 ? 5 : 2, c = size / 2;
  const defs = [['closed','var(--navy-900)'],['fixed','var(--steel-600)'],['target','var(--on-target)'],
                ['assigned','var(--navy-800)'],['clear','var(--blocked)']];
  let out = `<div class="rings" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${diag ? 'Calibrating' : 'Five rings'}">`;
  defs.forEach((d, i) => {
    const rad = c - stroke / 2 - i * (stroke + gap);
    out += `<circle cx="${c}" cy="${c}" r="${rad}" fill="none" stroke="var(--hairline)" stroke-width="${diag ? 1 : stroke}"/>`;
  });
  if (!diag) defs.forEach((d, i) => {
    const rad = c - stroke / 2 - i * (stroke + gap), circ = 2 * Math.PI * rad;
    const val = Math.max(0.001, Math.min(1, r[d[0]]));
    const broken = d[0] === 'clear' && r.clear === 0;
    out += `<circle class="arc" cx="${c}" cy="${c}" r="${rad}" fill="none"
      stroke="${broken ? 'var(--blocked)' : d[1]}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${circ * val} ${circ}" transform="rotate(-90 ${c} ${c})"
      style="--circ:${circ};--delay:${i * 80}ms"/>`;
  });
  out += `</svg>`;
  if (size >= 100) out += `<div class="mid">${diag
    ? '<span class="up">calibrating</span>'
    : `<b>${esc(centre)}</b>`}</div>`;
  return out + `</div>`;
}

const sect = (n, title, meta) => `<div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:11px">

    id: 'c' + Date.now(), person: a.id, date: t, dept: a.dept,
    fixedDue: duties.length, fixedDone: dc.ticked.length,
    metric: kpi ? kpi.metric : null, target: kpi ? kpi.daily : null, dir: kpi ? kpi.dir : null,
    actual: dc.actual === '' ? null : Number(dc.actual),
    onTrack: open.filter(x => ['On Track','Not Started'].includes(x.status)).length,
    atRisk: open.filter(x => ['At Risk','Blocked'].includes(x.status)).length,
    doneToday: Object.values(dc.pills).filter(v => v === 'Completed').length,
    reactive: dc.reactive, tags: [...dc.tags], blocker: dc.blocked,
    top3: dc.top3.filter(x => x.trim()),
    onTime: minutesNow() <= 19 * 60 + 30, reviewed: false, reviewedBy: null,
    seconds: Math.round((Date.now() - dc.openedAt) / 1000),
  };
  S.closes.push(close);
  if (dc.blocked) {
    S.blockers.push({ id: 'b' + Date.now(), raisedBy: a.id, unblocker: dc.unblocker, closeId: close.id,
      taskId: null, description: dc.desc.trim(), severity: dc.severity,
      raisedAt: new Date().toISOString(),
      slaDue: new Date(Date.now() + S.settings.sla * 3600000).toISOString(),
      firstResponse: null, resolvedAt: null, escalatedAt: null });
  }
  audit('SUBMIT', 'day_close', t);
  save();
  const secs = close.seconds;
  dc = null;
  toast(`Day closed in ${Math.floor(secs / 60)}m ${secs % 60}s · ${streakOf(a.id)} day streak`);
  go('my-day');
}

/* ── Board ─────────────────────────────────────────────────────────────── */
let boardView = 'kanban', boardMine = false, boardOverdue = false;
function board() {
  const a = me();
  let list = S.tasks.filter(t => t.type !== 'Fixed' && canViewTask(a, t) &&
    !['Declined','Missed','Dropped'].includes(t.status));
  if (boardMine) list = list.filter(t => t.owner === a.id);
  if (boardOverdue) list = list.filter(t => isOverdue(t.due, t.status));
  list.sort((x, y) => x.due.localeCompare(y.due));
  const lanes = ['Awaiting Acceptance','Not Started','On Track','At Risk','Blocked','Completed'];

  let h = `<div class="stack"><div class="between"><h1>Board</h1><div class="row s5">
    <button class="chip" aria-pressed="${boardView === 'kanban'}" onclick="boardView='kanban';render()">Kanban</button>
    <button class="chip" aria-pressed="${boardView === 'list'}" onclick="boardView='list';render()">List</button>
    <span class="muted">·</span>
    <button class="chip" aria-pressed="${boardMine}" onclick="boardMine=!boardMine;render()">My work</button>
    <button class="chip" aria-pressed="${boardOverdue}" onclick="boardOverdue=!boardOverdue;render()">Overdue only</button>
    <button class="btn sm" onclick="go('assign')">New task</button></div></div>`;

  if (!list.length) h += card(`<div class="empty"><p>Nothing on the board with these filters.</p>
    <p class="muted s5">Clear a filter, or hand something to someone with New task.</p></div>`);
  else if (boardView === 'kanban') {
    h += `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px">`;
    lanes.forEach(l => { const items = list.filter(t => t.status === l);
      h += `<section aria-label="${l}"><h3 class="s5 muted" style="display:flex;justify-content:space-between;margin-bottom:8px;font-family:var(--font-body);font-weight:600">
        ${l}<span class="tab">${items.length}</span></h3><div class="stack" style="gap:8px">`;
      items.forEach(t => h += `<button class="card" style="padding:11px;text-align:left;cursor:pointer;width:100%;background:var(--surface)"
        onclick="go('task','${t.id}')">
        <div class="row" style="justify-content:space-between"><span class="tab s6 muted">${t.code}</span>${prioMark(t.priority)}</div>
        <p class="s5" style="margin-top:5px;line-height:1.35">${esc(t.title)}</p>
        <div class="row" style="justify-content:space-between;margin-top:8px">
          <span class="s6 muted">${esc(first(t.owner))}</span>${flagChip(taskFlag(t.due, t.status))}</div></button>`);
      h += `</div></section>`; });
    h += `</div>`;
  } else {
    h += `<div class="card scroll"><table><thead><tr>
      <th>Task ID</th><th>Task Description</th><th>Owner</th><th>Assigned By</th><th>Due Date</th>
      <th>Priority</th><th>Status</th><th class="num">Days Left</th><th>Flag</th></tr></thead><tbody>`;
    list.forEach(t => h += `<tr style="cursor:pointer" onclick="go('task','${t.id}')">
      <td class="tab muted">${t.code}</td><td>${esc(t.title)}</td><td>${esc(nameOf(t.owner))}</td>
      <td class="muted">${esc(nameOf(t.by))}</td><td class="tab">${fmtShort(t.due)}</td>
      <td>${prioMark(t.priority)}</td><td>${statusPill(t.status)}</td>
      <td class="num">${t.status === 'Completed' ? 'Done' : daysLeft(t.due)}</td>
      <td>${flagChip(taskFlag(t.due, t.status))}</td></tr>`);
    h += `</tbody></table></div>`;
  }
  return h + `</div>`;
}

/* ── Task detail ───────────────────────────────────────────────────────── */
function taskDetail(id) {
  const a = me(), t = S.tasks.find(x => x.id === id);
  if (!t || !canViewTask(a, t)) return card(`<div class="empty"><p>Not found, or not yours to see.</p></div>`);
  const isOwn = t.owner === a.id, isAssigner = [t.by, t.accountable].includes(a.id);
  const canDrop = isAssigner || isOwner(a);
  const reviewers = (t.supports || []).filter(s => s.role === 'Reviewer');
  const unsigned = reviewers.filter(s => !s.signedOff);
  const openAppr = S.approvals.filter(x => x.taskId === t.id && x.decision === 'Pending');
  const myReview = reviewers.find(s => s.person === a.id && !s.signedOff);
  const bl = S.blockers.filter(b => b.taskId === t.id);
  const open = !['Completed','Dropped','Declined','Missed'].includes(t.status);
  const chain = t.chain && t.chain.length ? [...t.chain, t.owner].map(nameOf).join(' → ') : null;

  const gate = (ok, why, html) => ok ? html
    : `<span title="${esc(why)}" style="display:inline-flex;opacity:.45;cursor:not-allowed">${html}</span>`;

  let h = `<div style="max-width:820px;margin:0 auto" class="stack">
    <div class="between"><div>
      <p class="tab s5 muted">${t.code}</p><h1 style="font-size:22px">${esc(t.title)}</h1>
      ${chain ? `<p class="s5 muted" style="margin-top:4px">Delegation: ${esc(chain)}</p>` : ''}
    </div><div class="row">${flagChip(taskFlag(t.due, t.status))}${statusPill(t.status)}</div></div>

    <div class="card"><div class="body" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px">
      ${meta('Owner', nameOf(t.owner))}${meta('Accountable', nameOf(t.accountable))}
      ${meta('Assigned by', nameOf(t.by))}${meta('Priority', t.priority)}
      ${meta('Due', fmtShort(t.due) + ' · ' + (t.status === 'Completed' ? 'Done' : daysLeft(t.due) + 'd left'))}
      ${meta('Estimate', t.est ? t.est + 'h' : '—')}${meta('Visibility', t.visibility)}${meta('Type', t.type)}
    </div></div>`;

  if (t.description) h += card(`<div class="body"><p style="white-space:pre-wrap">${esc(t.description)}</p></div>`);

  h += `<div class="card"><div class="body stack" style="gap:11px"><div class="row">`;
  if (open) {
    h += gate(isOwn || isOwner(a), 'Only the owner moves a task forward.',
      `<button class="btn sec sm" ${t.status === 'On Track' ? 'disabled' : ''} onclick="moveTask('${t.id}','On Track')">On Track</button>`);
    h += `<button class="btn sec sm" ${t.status === 'At Risk' ? 'disabled' : ''} onclick="moveTask('${t.id}','At Risk')">At Risk</button>`;
    h += `<button class="btn sec sm" onclick="blockPrompt('${t.id}')">Blocked…</button>`;
    h += gate(isOwn || isOwner(a), 'Only the owner marks their work done.',
      `<button class="btn sm" onclick="moveTask('${t.id}','Completed')">Mark done</button>`);
    h += gate(isOwn || isOwner(a), 'Only the current owner may delegate.',
      `<button class="btn sec sm" onclick="delegatePrompt('${t.id}')">Delegate…</button>`);
    h += gate(canDrop, 'Only the assigner (or the Owner) can drop a task.',
      `<button class="btn danger sm" onclick="dropPrompt('${t.id}')">Drop…</button>`);
  } else if (t.status === 'Completed' && canDrop) {
    h += `<button class="btn sec sm" onclick="moveTask('${t.id}','On Track')">Reopen (7-day window)</button>`;
  }
  if (myReview && t.status === 'Pending Review')
    h += `<button class="btn sm" onclick="signOff('${t.id}')">Sign off review</button>`;
  h += `<button class="btn ghost sm" onclick="kudosPrompt('${t.owner}','${t.id}')">💛 Kudos</button>`;
  h += `</div>`;
  if (unsigned.length || openAppr.length) h += `<div class="guard"><span aria-hidden="true">▲</span><div>
    Completion is gated: ${unsigned.length ? `${unsigned.length} reviewer${unsigned.length === 1 ? '' : 's'} yet to sign off` : ''}
    ${unsigned.length && openAppr.length ? ' and ' : ''}${openAppr.length ? 'an approval is still open' : ''}.</div></div>`;
  h += `</div></div>`;

  if (bl.length) h += `<div class="card"><header><h3>Blockers</h3></header><div class="body stack" style="gap:9px">
    ${bl.map(b => { const s = slaText(b.slaDue, !!b.resolvedAt);
      return `<div class="row" style="justify-content:space-between"><span style="flex:1">“${esc(b.description)}” → ${esc(nameOf(b.unblocker))}</span>
      <span class="tab s5 ${s.cls}">${s.text}</span></div>`; }).join('')}</div></div>`;

  h += `<div class="card"><header><h3>Supports</h3>
    <button class="btn sec sm" onclick="supportPrompt('${t.id}')">Add support</button></header><div class="body flush">`;
  if (!(t.supports || []).length) h += `<div class="empty" style="padding:20px"><p class="muted s5">Nobody supporting yet.</p></div>`;
  else h += `<ul class="list">${t.supports.map(s => `<li><span style="flex:1">${esc(nameOf(s.person))}</span>
    <span class="s6 muted">${s.role}${s.role === 'Reviewer' && s.signedOff ? ' · signed off' : ''}</span></li>`).join('')}</ul>`;
  h += `</div></div>`;

  const cm = S.comments.filter(c => c.subject === t.id);
  h += `<div class="card"><header><h3>Thread</h3></header><div class="body stack" style="gap:9px">
    ${cm.map(c => `<div class="${c.system ? 's6 muted' : 's4'}"><b>${esc(nameOf(c.author))}</b> ${esc(c.body)}</div>`).join('') ||
      '<p class="s5 muted">Nothing said yet.</p>'}
    <form class="row" style="gap:8px" onsubmit="addComment(event,'${t.id}')">
      <input type="text" name="body" required placeholder="Write to the thread…" style="flex:1"/>
      <button class="btn">Send</button></form></div></div>`;

  const trail = S.audit.filter(x => x.entity === 'task' && x.detail && x.detail.startsWith(t.code));
  h += `<details class="card audit"><summary>Audit trail</summary>
    <ul class="list">${trail.map(x => `<li class="s6 muted tab">${new Date(x.at).toLocaleString('en-IN')} · ${esc(x.action)} · ${esc(x.detail)}</li>`).join('')
      || '<li class="s6 muted">Nothing recorded yet in this browser.</li>'}</ul></details>`;

  return h + `</div>`;
}
const meta = (l, v) => `<div><p class="s6 up muted">${esc(l)}</p><p style="margin-top:2px">${esc(v)}</p></div>`;

/* ── Assign ────────────────────────────────────────────────────────────── */
let asg = null;
function assign() {
  const a = me();
  if (!asg) asg = { title:'', desc:'', owner:a.id, priority:'P2 - Important',
    due: addDays(todayISO(), 3), time:'19:30', est:'', visibility:'Team',
    warnings:[], override:'', ackd:[], ask: routeArg === 'ask', askBody:'' };
  const cands = S.people.filter(p => p.status !== 'Deactivated')
    .map(p => ({ p, verb: canAssignTo(a, p), open: openTasksOf(p.id).length }))
    .filter(c => c.verb);
  const chosen = cands.find(c => c.p.id === asg.owner);
  const verb = chosen ? chosen.verb : null;
  const isAsk = verb === 'Ask';
  const maxOpen = Math.max(1, ...cands.map(c => c.open));
  const explain = {
    'Direct':'Lands on their board immediately as Not Started.',
    'Peer Request':'They get 12 hours to accept, decline with a reason, or counter-propose. Nothing lands until they say yes.',
    'Cross-department Request':'Goes to their department head first — their people’s time is not free.',
    'Ask':'A senior’s board is theirs: this sends an Ask they can convert, answer, or decline.' };

  let h = `<div style="max-width:640px;margin:0 auto" class="stack">
    <h1>${isAsk ? 'Ask someone' : 'Hand work to someone'}</h1>
    <div class="card"><div class="body stack" style="gap:14px">
      <label class="fld"><span>Who</span><div class="picker">`;
  cands.forEach(c => {
    h += `<button class="cand" aria-pressed="${asg.owner === c.p.id}" onclick="asg.owner='${c.p.id}';asg.warnings=[];asg.ackd=[];render()">
      <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.p.name)}${c.p.id === a.id ? ' (me)' : ''}
        <span class="muted s5">· ${esc(c.p.dept)}</span></span>
      <span class="load" aria-label="${c.open} open tasks"><i style="width:${Math.min(100, (c.open / maxOpen) * 100)}%"></i></span>
      <span class="tab s6 muted">${c.open}</span></button>`;
  });
  h += `</div></label>`;
  if (verb && verb !== 'Direct')
    h += `<div class="note"><b>${isAsk ? 'This becomes an Ask.' : 'This becomes a ' + verb + '.'}</b> ${explain[verb]}</div>`;

  h += `<label class="fld"><span>${isAsk ? 'What do you need?' : 'Task'}</span>
    <input type="text" value="${esc(asg.title)}" oninput="asg.title=this.value"
      placeholder="${isAsk ? 'One line — they triage it' : 'What has to get done?'}"/></label>`;

  if (isAsk) h += `<label class="fld"><span>Context (optional)</span>
    <textarea oninput="asg.askBody=this.value" placeholder="Anything that helps them decide.">${esc(asg.askBody)}</textarea></label>`;
  else h += `<label class="fld"><span>Detail (optional)</span>
      <textarea oninput="asg.desc=this.value" placeholder="Definition of done, links, context.">${esc(asg.desc)}</textarea></label>
    <div class="grid2">
      <label class="fld"><span>Due date</span><input type="date" value="${asg.due}" oninput="asg.due=this.value;asg.warnings=[]"/></label>
      <label class="fld"><span>Due time</span><input type="time" value="${asg.time}" oninput="asg.time=this.value"/></label>
      <label class="fld"><span>Priority</span><select onchange="asg.priority=this.value;asg.warnings=[]">
        ${['P1 - Critical','P2 - Important','P3 - Nice to have'].map(p => `<option ${asg.priority === p ? 'selected' : ''}>${p}</option>`).join('')}
      </select></label>
      <label class="fld"><span>Estimated hours</span><input type="number" min="0.5" step="0.5" value="${esc(asg.est)}"
        oninput="asg.est=this.value;asg.warnings=[]" placeholder="drives the load meter"/></label>
      <label class="fld"><span>Visibility</span><select onchange="asg.visibility=this.value">
        ${['Team','Department','Private'].map(v => `<option ${asg.visibility === v ? 'selected' : ''}>${v}</option>`).join('')}
      </select></label>
    </div>`;
  h += `</div></div>`;

  if (asg.warnings.length) {
    h += `<div class="stack" style="gap:9px">`;
    asg.warnings.forEach(w => {
      h += `<div class="guard"><span aria-hidden="true">▲</span><div>${esc(w.msg)}
        ${w.detail ? `<ul>${w.detail.map(d => `<li>${esc(d.title)}</li>`).join('')}</ul>` : ''}
        ${w.fix ? `<button class="fix" onclick="asg.due='${w.fix.due}';asg.warnings=asg.warnings.filter(x=>x.code!=='${w.code}');render()">Move it there</button>` : ''}
      </div></div>`;
    });
    h += `<input type="text" placeholder="Reason for going ahead anyway (recorded on the task)"
      value="${esc(asg.override)}" oninput="asg.override=this.value"/>
      <button class="btn" ${asg.override.trim() ? '' : 'disabled'} onclick="doAssign(true)">Assign anyway</button></div>`;
  } else {
    const ready = asg.title.trim() && asg.owner && (isAsk || asg.due);
    h += `<button class="btn lg" ${ready ? '' : 'disabled'} onclick="doAssign(false)">
      ${isAsk ? 'Send the Ask' : verb === 'Direct' ? 'Assign' : 'Send ' + (verb || 'request')}</button>`;
  }
  return h + `</div>`;
}
function doAssign(overriding) {
  const a = me(), target = person(asg.owner), verb = canAssignTo(a, target);
  if (!verb) return toast('You cannot assign to this person.');
  if (verb === 'Ask') {
    S.asks.push({ id:'a' + Date.now(), from:a.id, to:target.id, status:'Open',
      body: asg.title + (asg.askBody ? ' — ' + asg.askBody : ''), at:new Date().toISOString() });
    audit('ASK', 'ask', asg.title); save(); asg = null;
    toast('Ask sent. Nothing lands on their board until they convert it.');
    return go('my-day');
  }
  const input = { title:asg.title, priority:asg.priority, due: asg.due + 'T' + asg.time, est: asg.est };
  if (!overriding) {
    const w = runGuards(target, input, verb).filter(x => !asg.ackd.includes(x.code));
    if (w.length) { asg.warnings = w; return render(); }
  }
  const code = 'TSK-' + String(++S.seq.task).padStart(3, '0');
  const urgent = verb === 'Peer Request' && (new Date(input.due + ':00+05:30') - Date.now()) < 24 * 3600000;
  S.tasks.push({ id:'t' + Date.now(), code, title:asg.title, description:asg.desc || null,
    owner:target.id, accountable:a.id, by:a.id, dept:target.dept, priority:asg.priority,
    status: verb === 'Direct' ? 'Not Started' : 'Awaiting Acceptance',
    assigned: todayISO(), due: input.due, est: asg.est ? Number(asg.est) : null,
    type:'Assigned', visibility:asg.visibility, chain:[], supports:[], verb,
    pendingWith: verb === 'Direct' ? null : (verb === 'Peer Request' ? target.id
      : (deptHeads(target.dept)[0] || S.people.find(p => p.role === 'Owner')).id),
    respondBy: verb === 'Direct' ? null
      : new Date(Date.now() + (verb === 'Peer Request' ? S.settings.peerHours : 24) * 3600000).toISOString(),
    urgent, override: overriding ? asg.override : null });
  audit('CREATE', 'task', code + ' ' + asg.title + (overriding ? ' · override: ' + asg.override : ''));
  save();
  const msg = verb === 'Direct' ? `${code} is on ${first(target.id)}'s board.`
    : `${code} sent as a ${verb}. The clock is running on their side.`;
  asg = null; toast(msg); go('board');
}

/* ── Review queue ──────────────────────────────────────────────────────── */
function review() {
  const a = me(), sc = rollupScope(a);
  if (sc.kind === 'self' || sc.kind === 'aggregate')
    return card(`<div class="empty"><p>The review queue belongs to managers.</p></div>`);
  const date = routeArg || todayISO();
  const closes = S.closes.filter(c => c.date === date && canReviewDayClose(a, c.person));
  let h = `<div class="stack"><div class="between">
    <h1>Review · ${esc(fmtDay(date))}</h1>
    <div class="row"><span class="s5 muted">${closes.filter(c => !c.reviewed).length} to review</span>
      <form class="control" onsubmit="event.preventDefault();go('review',this.d.value)">
        <label for="rd">Day to view:</label><input id="rd" name="d" type="date" value="${date}"/>
        <button class="btn sm">View</button></form></div></div>`;
  if (!closes.length) h += card(`<div class="empty"><p>No closes yet for this day.</p>
    <p class="muted s5">They start arriving at 18:00.</p></div>`);
  else {
    h += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px">`;
    closes.forEach(c => {
      const ach = achievementPct(c.actual, c.target, c.dir);
      const r = computeRings({ submitted:true, fixedDone:c.fixedDone, fixedDue:c.fixedDue,
        achievement:ach, assignedOpen:c.onTrack + c.atRisk, assignedOverdue:c.atRisk, blockersPastSla:0 });
      const bl = S.blockers.find(b => b.closeId === c.id);
      h += `<div class="card"><div class="body">
        <div class="row" style="align-items:flex-start;flex-wrap:nowrap">
          ${ringsSvg(r, '', 44, diagnostic())}
          <div style="flex:1;min-width:0">
            <p class="s4"><b>${esc(nameOf(c.person))}</b></p>
            <p class="s6 muted">${esc(c.dept)} · ${c.onTime ? 'on time' : 'late'}</p></div>
          <div style="text-align:right">
            <p class="tab s3" style="font-family:var(--font-display);font-weight:700">${diagnostic() || ach == null ? '—' : Math.round(ach * 100) + '%'}</p>
            <p class="s6 muted">fixed ${c.fixedDone}/${c.fixedDue}</p></div></div>
        <div class="row" style="justify-content:space-around;text-align:center;margin-top:12px">
          <div><p class="s6 muted">Reactive</p><p class="tab s5">${c.reactive}h</p></div>
          <div><p class="s6 muted">At risk</p><p class="tab s5">${c.atRisk}</p></div>
          <div><p class="s6 muted">Done today</p><p class="tab s5">${c.doneToday}</p></div></div>
        ${bl ? `<p class="s5" style="margin-top:11px;background:color-mix(in srgb,var(--blocked) 11%,transparent);
          color:var(--blocked);border-radius:6px;padding:8px 11px">Blocked: ${esc(bl.description)}</p>` : ''}
        ${c.top3.length ? `<ol class="ol muted" style="margin-top:11px">${c.top3.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : ''}
        <div class="row" style="margin-top:12px">
          ${c.reviewed ? `<span class="s5" style="color:var(--on-target)">Reviewed ✓</span>`
            : ['👍','💪','👀'].map(e => `<button class="btn sec sm" onclick="reviewClose('${c.id}','${e}')">${e}</button>`).join('')}
        </div></div></div>`;
    });
    h += `</div>`;
  }
  return h + `</div>`;
}

/* ── Blockers ──────────────────────────────────────────────────────────── */
function blockers() {
  const a = me();
  const open = S.blockers.filter(b => !b.resolvedAt && canViewBlocker(a, b))
    .sort((x, y) => x.slaDue.localeCompare(y.slaDue));
  const done = S.blockers.filter(b => b.resolvedAt && canViewBlocker(a, b)).slice(0, 8);
  let h = `<div class="stack"><h1>Blockers</h1>`;
  if (!open.length) h += card(`<div class="empty"><p>Nothing is blocked. Rare and good.</p></div>`);
  else open.forEach(b => { const s = slaText(b.slaDue, false), mine = b.unblocker === a.id;
    h += `<div class="card"><div class="body"><div class="between" style="align-items:flex-start">

function footprintOf(pid) {

    duties: (S.charters[pid] ? S.charters[pid].duties.filter(d => d.active) : []),

function commitHandover() {

  fp.duties.forEach(d => { const m = hoState.duties[d.id]; if (!m) return;

  fp.kpis.forEach(k => { const m = hoState.kpis[k.id]; if (!m) return;

  fp.reports.forEach(r => { const m = hoState.reports[r.id]; if (m && m.to) r.boss = m.to; });
  const moved = Object.values(hoState.tasks).filter(x => x && x.to).length;
  const dutiesMoved = Object.values(hoState.duties).filter(x => x && x.to).length;
  const susp = Object.values(hoState.duties).filter(x => x && x.suspend).length;

      <label class="fld"><span>Window closes (on-time until)</span><input type="time" name="close" value="${s.close}"/></label>
      <label class="fld"><span>Grace until (next morning)</span><input type="time" name="grace" value="${s.grace}"/></label>

        <span class="s6 muted">No red, no ratings until that date.</span></div>

      <button class="btn danger sm" onclick="resetAll()">Reset demo data</button>
    </div></div></div></div>`;

function saveSettings(e) {

function toggleTheme() {
  const el = document.documentElement;
  const cur = el.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : cur === 'light' ? 'dark'
    : (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark');
  el.setAttribute('data-theme', next);
  try { localStorage.setItem('5c-theme', next); } catch (e) {}
}

function toggleDuty(did) {

function moveTask(id, status) {
  const t = S.tasks.find(x => x.id === id), a = me();
  if (status === 'Completed') {
    const unsigned = (t.supports || []).filter(s => s.role === 'Reviewer' && !s.signedOff);
    const appr = S.approvals.filter(x => x.taskId === t.id && x.decision === 'Pending');
    if (unsigned.length) { t.status = 'Pending Review'; save(); render();
      return toast(`Completion is gated: ${unsigned.length} reviewer${unsigned.length === 1 ? '' : 's'} must sign off.`); }
    if (appr.length) { save(); render(); return toast('Completion is gated: an approval is still open on this task.'); }
  }
  if (['Not Started'].includes(t.status) && ['On Track','At Risk','Blocked'].includes(status)) t.started = todayISO();
  t.status = status;
  S.comments.push({ id:'m' + Date.now(), subject:t.id, author:a.id, body:`moved ${t.code} to ${status}`, system:true });
  audit('STATUS', 'task', `${t.code} → ${status}`);
  save(); render(); toast(`${t.code} → ${status}`);
}
function signOff(id) {
  const t = S.tasks.find(x => x.id === id), a = me();
  (t.supports || []).forEach(s => { if (s.person === a.id && s.role === 'Reviewer') s.signedOff = true; });
  const unsigned = t.supports.filter(s => s.role === 'Reviewer' && !s.signedOff);
  const appr = S.approvals.filter(x => x.taskId === t.id && x.decision === 'Pending');
  if (!unsigned.length && !appr.length && t.status === 'Pending Review') t.status = 'Completed';
  audit('SIGN OFF', 'task', t.code); save(); render(); toast('Signed off.');
}

/* ── export: multi-tab workbook in the source layout ───────────────────── */
function exportWorkbook() {
  const s = S.settings;
  const esc2 = v => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const cell = v => typeof v === 'number' && isFinite(v)
    ? `<Cell><Data ss:Type="Number">${v}</Data></Cell>`
    : `<Cell><Data ss:Type="String">${esc2(v)}</Data></Cell>`;
  const row = arr => `<Row>${arr.map(cell).join('')}</Row>`;
  const sheet = (name, rows) =>
    `<Worksheet ss:Name="${esc2(name)}"><Table>${rows.map(row).join('')}</Table></Worksheet>`;

  const tabs = [];
  tabs.push(sheet('START HERE', [
    ['TEAM OPERATING SYSTEM  —  Task Allocation & Daily EOD Reporting'], [],
    ['RULES THAT KEEP THIS ALIVE'],
    ['•  Submission window: 6:00 PM - 7:30 PM. A report filed next morning is marked late.'],
    ['•  The form must take under 5 minutes. If it takes longer, people stop filing honestly.'],
    ['•  You must respond to every blocker within 24 hours.'],
    ['•  Review targets WEEKLY or MONTHLY, never daily.'],
    ['•  First 3-4 weeks: use this data diagnostically, not punitively.'],
    ['•  Max 4 KPIs and roughly 5 fixed tasks per person.'], [],
    ['Exported from 5C Pulse on ' + todayISO() + '.'],
  ]));
  tabs.push(sheet('Team Directory', [['TEAM DIRECTORY'], [],
    ['Employee ID','Team Member','Department','Role / Designation','Reports To','Email','Active?'],
    ...S.people.map(p => [p.code, p.name, p.dept, p.desig, p.boss ? nameOf(p.boss) : '—', p.email,
      p.status === 'Deactivated' ? 'No' : 'Yes'])]));
  const charterRows = [['ROLE CHARTERS'], [],
    ['Department','Team Member','Owns (Outcome, not activity)','Fixed Task','Cadence','Definition of Done','Can Decide Alone','Needs Your Approval']];
  S.people.forEach(p => { const ch = S.charters[p.id]; if (!ch) return;
    ch.duties.filter(d => d.active).forEach((d, i) => charterRows.push([
      i === 0 ? p.dept : '', i === 0 ? p.name : '', i === 0 ? ch.owns : '', d.title, d.cadence, d.dod,
      i === 0 ? ch.alone.join('; ') : '', i === 0 ? ch.approval.join('; ') : '']));
    charterRows.push([]); });
  tabs.push(sheet('Role Charters', charterRows));
  tabs.push(sheet('KPI Targets', [['KPI TARGETS'], [],
    ['Working days per week', s.wdWeek], ['Working days per month', s.wdMonth], [],
    ['Department','Owner','Metric','Unit','Target Type','Direction','Daily Target','Weekly Target','Monthly Target','Review Cadence'],
    ...S.kpis.filter(k => k.active && !k.to).map(k => [person(k.person).dept, nameOf(k.person), k.metric, k.unit,
      k.type, k.dir, k.daily, weeklyTarget(k.daily, k.type, s.wdWeek), monthlyTarget(k.daily, k.type, s.wdMonth), k.cadence])]));
  tabs.push(sheet('Assigned Tasks', [['ASSIGNED TASKS'], [],
    ['Task ID','Task Description','Owner','Department','Assigned By','Assigned On','Due Date','Priority','Status','Days Left','Flag'],
    ...S.tasks.filter(t => t.type !== 'Fixed').map(t => [t.code, t.title, nameOf(t.owner), t.dept, nameOf(t.by),
      t.assigned, t.due.slice(0, 10), t.priority, t.status,
      t.status === 'Completed' ? 'Done' : daysLeft(t.due), taskFlag(t.due, t.status)])]));
  tabs.push(sheet('Daily EOD Log', [['DAILY EOD LOG'], [],
    ['Date','Week Starting','Month','Team Member','Department','Fixed Tasks Due','Fixed Tasks Done','Fixed %',
     'Primary Metric','Target','Actual','Achievement %','Assigned: On Track','Assigned: At Risk','Assigned: Completed Today',
     'Reactive Hours','Blocker?','Blocker Description','Who Can Unblock','Top 3 For Tomorrow','Submitted On Time?','Manager Reviewed?'],
    ...S.closes.map(c => { const b = S.blockers.find(x => x.closeId === c.id);
      return [c.date, weekStart(c.date), monthOf(c.date), nameOf(c.person), c.dept, c.fixedDue, c.fixedDone,
        fixedPct(c.fixedDone, c.fixedDue) ?? '', c.metric || '', c.target ?? '', c.actual ?? '',
        c.target ? (c.actual || 0) / c.target : '', c.onTrack, c.atRisk, c.doneToday, c.reactive,
        c.blocker ? 'Yes' : 'No', b ? b.description : '', b ? nameOf(b.unblocker) : '',
        (c.top3 || []).join('; '), c.onTime ? 'Yes' : 'No', c.reviewed ? 'Yes' : 'No']; })]));

  const rollTab = (label, period, control, expected) => {
    const cs = S.closes.filter(c => period === 'week' ? weekStart(c.date) === control : monthOf(c.date) === control);
    const ppl = S.people.filter(p => p.status !== 'Deactivated' && p.role !== 'Observer');
    const { rows, total } = buildRollup(ppl, cs, expected);
    const monthly = period === 'month';
    const head = ['Team Member','Department','Days Submitted','Submission Rate','On-Time Rate','Fixed Tasks Due',
      'Fixed Tasks Done','Fixed Task %','Total Target','Total Actual','Achievement %'];
    return sheet(label, [[label.toUpperCase()], [],
      [monthly ? 'Month to view:' : 'Week to view:', control],
      [monthly ? 'Expected working days this month:' : 'Expected working days this week:', expected], [],
      monthly ? [...head, 'Reactive Hrs','Blockers Raised','Rating Input'] : [...head, 'Status'],
      ...rows.map(r => { const base = [r.name, r.dept, r.days, r.rate ?? '', r.onTimeRate ?? '', r.fD, r.fN,
        r.fx ?? '', r.tgt, r.act, r.ach ?? ''];
        return monthly ? [...base, r.reactive, r.blockers, r.rating] : [...base, r.status]; }),
      monthly ? ['TEAM TOTAL','',total.days,'','',total.fD,total.fN,total.fx ?? '',total.tgt,total.act,total.ach ?? '',total.reactive,total.blockers,'']
              : ['TEAM TOTAL','',total.days,'','',total.fD,total.fN,total.fx ?? '',total.tgt,total.act,total.ach ?? '','']]);
  };
  tabs.push(rollTab('Weekly Rollup', 'week', rollWeek || weekStart(todayISO()), s.wdWeek));
  tabs.push(rollTab('Monthly Rollup', 'month', rollMonth || monthOf(todayISO()), s.wdMonth));

  const xml = `<?xml version="1.0"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">${tabs.join('')}</Workbook>`;
  saveFile('5C-Pulse-' + todayISO() + '.xls', xml, 'application/vnd.ms-excel');
}
async function saveFile(filename, text, mime) {
  // Inside the claude.ai viewer, page-initiated downloads are blocked — the
  // host grants an explicit save instead. Opened from disk, the classic link works.
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const dl = await window.claude.use('downloads');
      if (dl) { await dl.save({ filename, data: text }); toast('Saved.'); return; }
    }
  } catch (e) { toast('Save cancelled.'); return; }
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast('Downloaded.');
}

/* ── person switcher (stands in for sign-in) ───────────────────────────── */
function whoDialog() {
  let h = `<div class="card"><header><h3>Who are you?</h3>
    <button class="btn ghost sm" onclick="modal('')">Close</button></header>
    <div class="body"><p class="s5 muted" style="margin-bottom:12px">
      There is no login in this single-file build — pick a person and every permission rule applies to them,
      exactly as the database would enforce it.</p><ul class="list">`;
  S.people.filter(p => p.status !== 'Deactivated').forEach(p => {
    h += `<li style="cursor:pointer" onclick="setMe('${p.id}')">
      <span class="avatar" style="background:var(--tint);color:var(--steel-600)">${esc(p.name.split(' ').map(x => x[0]).slice(0, 2).join(''))}</span>
      <span style="flex:1"><b>${esc(p.name)}</b><br><span class="s6 muted">${esc(p.desig)} · ${esc(p.dept)}</span></span>
      <span class="pill c-idle">${esc(p.role)}</span>
      ${(p.caps || []).map(c => `<span class="cap">${c}</span>`).join('')}
      ${p.id === S.me ? '<span class="s6" style="color:var(--on-target)">you</span>' : ''}</li>`;
  });
  return h + `</ul></div></div>`;
}
function setMe(id) { S.me = id; dc = null; asg = null; save(); modal(''); go('my-day'); }

/* ── render ────────────────────────────────────────────────────────────── */
function renderSoft() {                     // re-render without losing scroll
  const y = window.scrollY;
  document.getElementById('app').innerHTML = screenHtml();
  window.scrollTo(0, y);
}
function screenHtml() {
  const a = me();
  const allowed = tabsFor(a).map(t => t[0]).concat(['task','assign']);
  if (!allowed.includes(route)) route = 'my-day';
  switch (route) {
    case 'my-day': return myDay();
    case 'day-close': return dayClose();
    case 'board': return board();
    case 'task': return taskDetail(routeArg);
    case 'assign': return assign();
    case 'review': return review();
    case 'blockers': return blockers();
    case 'rollups': return rollups();
    case 'charters': return charters();
    case 'targets': return targets();
    case 'people': return people();
    case 'settings': return settings();
    default: return myDay();
  }
}
function render() {
  const a = me();
  document.getElementById('tabs').innerHTML = tabsFor(a)
    .map(([k, label]) => `<button ${route === k ? 'aria-current="page"' : ''} onclick="go('${k}')">${label}</button>`).join('');
  document.getElementById('who').innerHTML =
    `<span class="avatar">${esc(a.name.split(' ').map(x => x[0]).slice(0, 2).join(''))}</span>
     <span style="text-align:left;line-height:1.2">${esc(a.name.split(' ')[0])}<br>
     <span style="font-size:11px;opacity:.75">${esc(a.role)}</span></span>`;
  document.getElementById('who').onclick = () => modal(whoDialog());
  document.getElementById('calib').hidden = !diagnostic();
  document.getElementById('app').innerHTML = screenHtml();
}

/* ── boot ──────────────────────────────────────────────────────────────── */
try { const th = localStorage.getItem('5c-theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (e) {}
load();
sweepSla();
render();
setInterval(() => { if (['my-day','blockers','day-close'].includes(route)) renderSoft(); }, 60000);
</script>
