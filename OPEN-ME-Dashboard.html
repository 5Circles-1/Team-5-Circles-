<title>5C Pulse</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
/* ══════════════════════════════════════════════════════════════════════
   5C PULSE — team dashboard, single file.
   Brand colour and logo are the real 5 Circles ones. To rebrand, change
   the tokens in :root and swap --logo. Nothing else holds a colour.
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --brand:#0281C2; --brand-deep:#076F9E; --brand-soft:#E7F3FA;
  --navy-900:#1F3864; --navy-800:#274877; --steel-600:#2E5C8A; --steel-300:#A9C0DA;
  --cream-100:#FFF2CC; --cream-ink:#5B4A12;
  --paper:#F7F9FB; --surface:#FFFFFF; --ink:#141922; --ink-muted:#5D6675;
  --hairline:rgba(31,56,100,.14); --sunken:#EFF3F7;
  --on-target:#1B7A52; --behind:#B7791F; --attention:#C62828; --blocked:#6B4E9E;
  --rail:#0F2440; --rail-ink:#FFFFFF; --btn:#0281C2; --btn-ink:#FFFFFF;
  --tint:rgba(2,129,194,.10);
  --fd:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --fb:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --fm:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#3FA9E0; --brand-deep:#7CC6EC; --brand-soft:#0E2C3E;
  --navy-900:#4A72B8; --navy-800:#3E63A8; --steel-600:#6C9AD0; --steel-300:#3B4F6B;
  --cream-100:#3A3320; --cream-ink:#F2DFA6;
  --paper:#0D1420; --surface:#151E2C; --ink:#E9EDF4; --ink-muted:#93A0B5;
  --hairline:rgba(150,178,212,.19); --sunken:#101927;
  --on-target:#4FBF8B; --behind:#DCA845; --attention:#F0736A; --blocked:#AC93D9;
  --rail:#0A1524; --rail-ink:#EAF0FA; --btn:#0281C2; --btn-ink:#FFFFFF;
  --tint:rgba(63,169,224,.15);
}}
:root[data-theme="dark"]{
  --brand:#3FA9E0; --brand-deep:#7CC6EC; --brand-soft:#0E2C3E;
  --navy-900:#4A72B8; --navy-800:#3E63A8; --steel-600:#6C9AD0; --steel-300:#3B4F6B;
  --cream-100:#3A3320; --cream-ink:#F2DFA6;
  --paper:#0D1420; --surface:#151E2C; --ink:#E9EDF4; --ink-muted:#93A0B5;
  --hairline:rgba(150,178,212,.19); --sunken:#101927;
  --on-target:#4FBF8B; --behind:#DCA845; --attention:#F0736A; --blocked:#AC93D9;
  --rail:#0A1524; --rail-ink:#EAF0FA; --btn:#0281C2; --btn-ink:#FFFFFF;
  --tint:rgba(63,169,224,.15);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--fd);margin:0;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:28px;font-weight:700;line-height:1.15}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:600;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
.tab{font-family:var(--fm);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-muted)}
.s5{font-size:14px}.s6{font-size:12px}
.up{text-transform:uppercase;letter-spacing:.06em}
.hide{display:none !important}

/* rail + alert bar + tabs move as one sticky block, so nothing overlaps */
.topbar{position:sticky;top:0;z-index:40}
.rail{background:var(--rail);color:var(--rail-ink)}
.rail .in{max-width:1140px;margin:0 auto;padding:0 14px;height:60px;display:flex;align-items:center;gap:12px}
.brandmark{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;color:inherit;padding:0}
.brandmark .chip{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;flex-shrink:0}
.brandmark img{width:30px;height:30px;display:block}
.brandmark b{font-family:var(--fd);font-weight:700;font-size:16px;letter-spacing:-.02em}
.brandmark span{display:block;font-size:11px;opacity:.72;font-weight:400;letter-spacing:0}
.railright{margin-left:auto;display:flex;align-items:center;gap:8px}
.who{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:0;border-radius:999px;
  padding:5px 12px 5px 5px;cursor:pointer;color:inherit;font-size:14px}
.av{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;
  font-size:12px;font-weight:700;flex-shrink:0}
/* big tabs — three, unmissable */
.tabs{background:var(--rail);border-top:1px solid rgba(255,255,255,.12)}
.tabs .in{max-width:1140px;margin:0 auto;display:flex}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:rgba(255,255,255,.7);
  padding:12px 6px 10px;cursor:pointer;font-size:14px;font-weight:600;display:flex;flex-direction:column;
  align-items:center;gap:3px;position:relative}
.tabs button:hover{color:#fff;background:rgba(255,255,255,.07)}
.tabs button[aria-current="page"]{color:#fff;border-bottom-color:var(--brand)}
.tabs .ic{font-size:19px;line-height:1}
.badge{position:absolute;top:6px;right:calc(50% - 30px);min-width:19px;height:19px;border-radius:999px;
  background:var(--attention);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
main{max-width:1140px;margin:0 auto;padding:18px 14px 90px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:14px}
.card>header{padding:14px 16px;border-bottom:1px solid var(--hairline);display:flex;align-items:center;
  justify-content:space-between;gap:10px}
.card>.body{padding:16px}
.card>.body.flush{padding:0}
.list{list-style:none;margin:0;padding:0}
.list>li{padding:13px 16px;border-top:1px solid var(--hairline);display:flex;align-items:center;gap:12px}
.list>li:first-child{border-top:0}
.empty{padding:34px 18px;text-align:center}

/* controls — large, obvious, no training needed */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border-radius:10px;
  border:1px solid transparent;background:var(--btn);color:var(--btn-ink);font-size:16px;font-weight:600;
  padding:0 18px;height:46px;transition:filter .13s,background .13s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none;transform:none}
.btn.sm{height:36px;padding:0 13px;font-size:14px;border-radius:8px}
.btn.lg{height:54px;width:100%;font-size:17px}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--hairline)}
.btn.sec:hover{background:var(--sunken);filter:none}
.btn.ghost{background:none;color:var(--ink-muted);border-color:transparent}
.btn.ghost:hover{background:var(--sunken);color:var(--ink);filter:none}
.btn.warn{background:var(--attention)}
.btn.ok{background:var(--on-target)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--hairline);border-radius:10px;padding:0 13px;
  height:48px;font-size:16px}
textarea{padding:11px 13px;height:auto;min-height:84px;resize:vertical;line-height:1.5}
label.fld{display:block}
label.fld>span{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
label.fld>em{display:block;font-style:normal;font-size:12px;color:var(--ink-muted);margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}
.note{border-radius:10px;padding:11px 14px;font-size:14px;background:var(--tint);color:var(--brand-deep)}
.warnbox{border-radius:10px;padding:11px 14px;font-size:14px;
  background:color-mix(in srgb,var(--behind) 12%,transparent);color:var(--behind);
  border:1px solid color-mix(in srgb,var(--behind) 34%,transparent)}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid;border-radius:999px;background:var(--surface);
  padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.c-ok{color:var(--on-target);border-color:color-mix(in srgb,var(--on-target) 42%,transparent)}
.c-warn{color:var(--behind);border-color:color-mix(in srgb,var(--behind) 45%,transparent)}
.c-bad{color:var(--attention);border-color:color-mix(in srgb,var(--attention) 45%,transparent)}
.c-idle{color:var(--ink-muted);border-color:var(--steel-300)}
.c-brand{color:var(--brand-deep);border-color:color-mix(in srgb,var(--brand) 42%,transparent);background:var(--brand-soft)}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

/* tick rows */
.tick{display:flex;gap:13px;align-items:flex-start;width:100%;background:none;border:0;padding:12px 8px;
  border-radius:10px;cursor:pointer;text-align:left}
.tick:hover{background:var(--sunken)}
.box{width:28px;height:28px;border-radius:50%;border:2px solid var(--steel-300);display:grid;place-items:center;
  flex-shrink:0;font-size:15px;transition:.13s;background:var(--surface)}
.tick[aria-checked="true"] .box{background:var(--on-target);border-color:var(--on-target);color:#fff}
.tick[aria-checked="true"] .tt{color:var(--ink-muted);text-decoration:line-through}
.seg{display:inline-flex;gap:5px;flex-wrap:wrap}
.seg button{background:var(--surface);border:1px solid var(--hairline);color:var(--ink-muted);border-radius:8px;
  padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:#fff}
.seg button.ok[aria-pressed="true"]{background:var(--on-target);border-color:var(--on-target)}
.seg button.warn[aria-pressed="true"]{background:var(--behind);border-color:var(--behind)}
.seg button.bad[aria-pressed="true"]{background:var(--attention);border-color:var(--attention)}

/* people chooser */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.pbtn{display:flex;align-items:center;gap:9px;background:var(--surface);border:2px solid var(--hairline);
  border-radius:12px;padding:10px;cursor:pointer;text-align:left;color:inherit}
.pbtn:hover{border-color:var(--steel-300)}
.pbtn[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.pbtn .av{width:34px;height:34px;font-size:13px}
.pbtn b{display:block;font-size:14px;font-weight:600;line-height:1.25}
.pbtn span{display:block;font-size:11px;color:var(--ink-muted)}

/* modal + alarm */
.sheet{position:fixed;inset:0;background:rgba(8,14,24,.66);display:grid;place-items:center;padding:14px;z-index:60}
.sheet .card{max-width:540px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 22px 60px rgba(4,10,20,.42)}
/* Two tiers of takeover. Red and pulsing is reserved for "keep ringing";
   an ordinary ping still blocks the screen but does not shout. */
#alarm{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px;
  background:rgba(10,18,32,.62);backdrop-filter:blur(2px)}
#alarm.urgent{background:rgba(198,40,40,.34);animation:pulsebg 1.1s infinite alternate}
@keyframes pulsebg{from{background:rgba(198,40,40,.24)}to{background:rgba(198,40,40,.46)}}
#alarm .card{max-width:460px;width:100%;border:2px solid var(--brand);text-align:center;
  box-shadow:0 26px 70px rgba(4,10,20,.5)}
#alarm.urgent .card{border:3px solid var(--attention)}
.ringicon{width:78px;height:78px;border-radius:50%;background:var(--brand);color:#fff;display:grid;
  place-items:center;font-size:38px;margin:0 auto 14px}
#alarm.urgent .ringicon{background:var(--attention);animation:shake .6s infinite}
@keyframes shake{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:80;background:var(--ink);
  color:var(--paper);border-radius:10px;padding:12px 18px;font-size:14px;box-shadow:0 10px 30px rgba(4,10,20,.34);
  max-width:92vw;text-align:center}
.enable{background:var(--brand);color:#fff;padding:11px 14px;display:flex;align-items:center;gap:12px;
  justify-content:center;flex-wrap:wrap;font-size:14px;font-weight:600}
.enable button{background:#fff;color:var(--brand-deep);border:0;border-radius:8px;padding:8px 15px;font-weight:700;cursor:pointer}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--hairline);background:var(--surface);color:var(--ink-muted);border-radius:999px;
  padding:6px 13px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-deep);font-weight:600}
.stepbar{display:flex;gap:6px;margin-bottom:14px}
.stepbar div{flex:1;height:5px;border-radius:3px;background:var(--hairline)}
.stepbar div.on{background:var(--brand)}
.mini{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--sunken);border-radius:10px}
/* schedule timeline */
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:flex;align-items:center;gap:12px;padding:8px 0 8px 16px;position:relative}
.timeline li::before{content:"";position:absolute;left:3px;top:0;bottom:0;width:2px;background:var(--hairline)}
.timeline li:first-child::before{top:50%}
.timeline li:last-child::before{bottom:50%}
.timeline li::after{content:"";position:absolute;left:0;top:calc(50% - 4px);width:8px;height:8px;
  border-radius:50%;background:var(--steel-300)}
.timeline .time{font-size:13px;color:var(--ink-muted);width:52px;flex-shrink:0}
.timeline .what{flex:1;font-size:15px}
.timeline li.past{opacity:.45}
.timeline li.past::after{background:var(--on-target)}
.timeline li.now::after{background:var(--brand);width:12px;height:12px;left:-2px;top:calc(50% - 6px);
  box-shadow:0 0 0 4px var(--brand-soft)}
.timeline li.now .what{font-weight:700}
.timeline li.now .time{color:var(--brand-deep);font-weight:700}
.bar{height:8px;border-radius:5px;background:var(--hairline);overflow:hidden;flex:1;min-width:70px}
.bar i{display:block;height:100%;background:var(--on-target);border-radius:5px}
table{border-collapse:collapse;width:100%;font-size:14px}
thead th{background:var(--sunken);text-align:left;font-weight:600;padding:9px 12px;white-space:nowrap;font-size:13px}
tbody td{padding:10px 12px;border-top:1px solid var(--hairline);vertical-align:middle}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>

   ══════════════════════════════════════════════════════════════════════ */
const IST=330;
const nowL=()=>new Date(Date.now()+IST*60000);
const today=()=>nowL().toISOString().slice(0,10);
const minsNow=()=>{const d=nowL();return d.getUTCHours()*60+d.getUTCMinutes()};
const dow=iso=>((new Date(iso+'T00:00:00Z').getUTCDay()+6)%7)+1;      // 1=Mon..7=Sun
const addD=(iso,n)=>new Date(new Date(iso+'T00:00:00Z').getTime()+n*86400000).toISOString().slice(0,10);
const fmtDay=iso=>new Date(iso+'T00:00:00Z').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'});
const fmtShort=iso=>new Date(String(iso).slice(0,10)+'T00:00:00Z').toLocaleDateString('en-IN',{day:'numeric',month:'short',timeZone:'UTC'});
const daysLeft=iso=>Math.round((new Date(String(iso).slice(0,10)+'T00:00:00Z')-new Date(today()+'T00:00:00Z'))/86400000);
const ago=ts=>{const m=Math.floor((Date.now()-new Date(ts))/60000);
  if(m<1)return'just now';if(m<60)return m+'m ago';const h=Math.floor(m/60);
  if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ══════════════════════════════════════════════════════════════════════
   THE ALARM ENGINE
   Rings until the person answers. Audio keeps playing when the tab is in
   the background; the tab title and the browser notification make it
   findable from any other tab or app.
   ══════════════════════════════════════════════════════════════════════ */
const Alarm={
  ctx:null,ready:false,timer:null,node:null,startedAt:0,current:null,
  titleTimer:null,originalTitle:'5C Pulse',

  /* Browsers refuse to make noise until the person has interacted once.
     One tap on "Turn on alerts" unlocks it for the whole session. */
  async enable(){
    try{
      if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext;this.ctx=new AC()}
      if(this.ctx.state==='suspended')await this.ctx.resume();
      // a silent blip completes the unlock on iOS
      const o=this.ctx.createOscillator(),g=this.ctx.createGain();
      g.gain.value=0.0001;o.connect(g);g.connect(this.ctx.destination);
      o.start();o.stop(this.ctx.currentTime+0.05);
      this.ready=true;
      if('Notification'in window&&Notification.permission==='default'){
        try{await Notification.requestPermission()}catch(e){}
      }
      localStorage.setItem('5c-sound','on');
      renderEnableBar();
      return true;
    }catch(e){return false}
  },

  /* One ring: a two-tone chime that cuts through. Scheduled on the audio
     clock so background-tab timer throttling cannot mute it. */
  ring(at,urgent){
    if(!this.ctx)return;
    const t=at,vol=(S.settings.volume==null?0.9:S.settings.volume);
    const tones=urgent?[880,1180,880,1180]:[740,988];
    tones.forEach((f,i)=>{
      const o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.type='triangle';o.frequency.value=f;
      const s=t+i*0.19,d=0.17;
      g.gain.setValueAtTime(0.0001,s);
      g.gain.exponentialRampToValueAtTime(vol,s+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,s+d);
      o.connect(g);g.connect(this.ctx.destination);
      o.start(s);o.stop(s+d+0.02);
    });
  },

  /* Keep ringing until acknowledged. Schedules ahead on the audio clock. */
  start(notice){
    this.current=notice;this.startedAt=Date.now();
    if(this.ready&&this.ctx){
      if(this.ctx.state==='suspended')this.ctx.resume();
      const urgent=notice.level==='alarm';
      let next=this.ctx.currentTime+0.05;
      const gap=urgent?1.25:2.4;
      const pump=()=>{
        if(!this.current)return;
        const elapsed=(Date.now()-this.startedAt)/1000;
        const limit=S.settings.ringSeconds||90;
        // ring hard for the first stretch, then a reminder every 25s
        const stillHard=elapsed<limit;
        const horizon=this.ctx.currentTime+3;
        while(next<horizon){this.ring(next,urgent&&stillHard);next+=stillHard?gap:25}
        if(next<this.ctx.currentTime)next=this.ctx.currentTime+0.05;
      };
      pump();
      this.timer=setInterval(pump,1500);
    }
    if(navigator.vibrate){try{navigator.vibrate([400,180,400,180,700])}catch(e){}}
    // Title flash — how you find the tab when you are somewhere else.
    // Set it at once: the first frame is the one that catches the eye.
    let on=true;
    clearInterval(this.titleTimer);
    document.title='🔴 '+first(notice.from)+' NEEDS YOU';
    this.titleTimer=setInterval(()=>{
      on=!on;
      document.title=on?'🔴 '+first(notice.from)+' NEEDS YOU':'🔔 5C Pulse — answer now';
    },700);
    // OS notification — shows even when the browser is behind other windows
    if('Notification'in window&&Notification.permission==='granted'){
      try{
        const n=new Notification((notice.level==='alarm'?'🔴 ':'🔔 ')+nameOf(notice.from)+' needs you',
          {body:notice.title+(notice.body?' — '+notice.body:''),tag:notice.id,requireInteraction:true});
        n.onclick=()=>{window.focus();n.close()};
      }catch(e){}
    }
    drawAlarm();
  },

  stop(){
    this.current=null;
    clearInterval(this.timer);this.timer=null;
    clearInterval(this.titleTimer);this.titleTimer=null;
    document.title=this.originalTitle;
    document.getElementById('alarmHost').innerHTML='';
  },
};

function drawAlarm(){
  const n=Alarm.current;if(!n)return;
  const urgent=n.level==='alarm';
  document.getElementById('alarmHost').innerHTML=`
  <div id="alarm" class="${urgent?'urgent':''}" role="alertdialog" aria-labelledby="alTitle">
    <div class="card"><div class="body">
      <div class="ringicon" aria-hidden="true">${urgent?'🔔':'💬'}</div>
      <p class="s5 muted">${urgent?'Needs you now':'Message'} · ${esc(ago(n.at))}</p>
      <h2 id="alTitle" style="margin:6px 0 8px">${esc(nameOf(n.from))}</h2>
      <p style="font-size:18px;font-weight:600">${esc(n.title)}</p>
      ${n.body?`<p class="muted" style="margin-top:8px">${esc(n.body)}</p>`:''}
      <div class="stack" style="gap:9px;margin-top:20px">
        <button class="btn lg ok" onclick="answerAlarm('On it')">✅ On it — I'll handle this</button>
        <div class="grid2">
          <button class="btn sec" onclick="answerAlarm('Give me 10 minutes')">⏱️ Give me 10 min</button>
          <button class="btn sec" onclick="replyAlarm()">💬 Reply…</button>
        </div>
      </div>
      <p class="s6 muted" style="margin-top:14px">The ringing stops as soon as you answer.
        ${esc(first(n.from))} sees your answer straight away.</p>
    </div></div></div>`;
}
function answerAlarm(text){
  const n=Alarm.current;if(!n)return;
  ackNotice(n.id,text);
  Alarm.stop();
  toast('Answered: '+text);
  render();
}
function replyAlarm(){
  const n=Alarm.current;if(!n)return;
  const host=document.getElementById('alarmHost');
  host.innerHTML=`<div id="alarm"><div class="card"><div class="body">
    <h3 style="margin-bottom:10px">Reply to ${esc(nameOf(n.from))}</h3>
    <form onsubmit="event.preventDefault();answerAlarm(this.r.value||'Replied')">
      <textarea name="r" autofocus placeholder="Type your answer…"></textarea>
      <button class="btn lg" style="margin-top:10px">Send answer</button>
    </form></div></div></div>`;
}
function ackNotice(id,answer){
  const n=S.notices.find(x=>x.id===id);if(!n)return;
  n.acks=n.acks||[];
  if(!n.acks.some(a=>a.who===S.me))n.acks.push({who:S.me,answer,at:new Date().toISOString()});
  n.read=n.read||[];if(!n.read.includes(S.me))n.read.push(S.me);
  save();
}
/* Deliver to whoever is signed in here, and to other tabs/windows. */
let bc=null;
try{bc=new BroadcastChannel('5c-pulse')}catch(e){}
if(bc)bc.onmessage=e=>{
  const m=e.data||{};
  if(m.type==='sync'){load();render()}
  if(m.type==='notice'){load();maybeRing(m.notice);render()}
};
window.addEventListener('storage',e=>{if(e.key===KEY){load();render()}});

function maybeRing(notice){
  if(!notice)return;
  if(notice.from===S.me)return;                       // never ring yourself
  if(!(notice.to===S.me||notice.to==='ALL'))return;   // not addressed to you
  if(notice.level==='notice')return;                  // silent level
  if((notice.acks||[]).some(a=>a.who===S.me))return;  // already answered
  Alarm.start(notice);
}
function testRing(){
  if(!Alarm.ready){Alarm.enable().then(()=>setTimeout(()=>Alarm.ring(Alarm.ctx.currentTime+0.05,true),120));return}
  Alarm.ring(Alarm.ctx.currentTime+0.05,true);
  toast('That is the alarm sound.');
}
function renderEnableBar(){
  const on=Alarm.ready;
  document.getElementById('enableBar').innerHTML=on?'':
    `<div class="enable"><span>🔔 Turn on sound so you hear it when someone needs you</span>
     <button onclick="Alarm.enable().then(()=>{toast('Alerts on. Try the Test button.');render()})">Turn on alerts</button></div>`;
}

/* ── sending ──────────────────────────────────────────────────────────── */
function sendNotice(to,title,body,level){
  const n={id:uid('n'),from:S.me,to,title,body:body||'',level,at:new Date().toISOString(),read:[],acks:[]};
  S.notices.unshift(n);save();
  try{bc&&bc.postMessage({type:'notice',notice:n})}catch(e){}
  return n;
}

  const owed=noticesFor(a.id).filter(n=>n.level!=='notice'&&n.from!==a.id
    &&!(n.acks||[]).some(k=>k.who===a.id));
  const closed=S.closes.some(c=>c.who===a.id&&c.date===t);
  const pct=duties.length?Math.round(done/duties.length*100):0;

  let h=`<div class="stack">
  <div class="between">
    <div><h1>${greet()} ${esc(first(a.id))}</h1>
      <p class="muted">${esc(fmtDay(t))}</p></div>

    </div>

  /* team strip — everyone, at a glance */
  h+=`<div class="card"><header><h3>The team today</h3>
    <span class="s5 muted">${activePeople().filter(p=>S.closes.some(c=>c.who===p.id&&c.date===t)).length}/${activePeople().length} closed</span>
    </header><div class="body" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px">`;

      ${p.id!==a.id?`<button class="btn ghost sm" title="Ping ${esc(p.name)}" onclick="quickPing('${p.id}')">🔔</button>`:''}
    </div>`});
  h+=`</div></div>`;

  /* admins get one extra card: who is still ramping up */
  if(isAdmin(a)){
    const learning=activePeople().filter(p=>trLeft(p.id));
    h+=`<div class="card"><header><h3>Training across the team</h3>
      <span class="s5 muted">${learning.length?learning.length+' still ramping up':'everyone is through'}</span>
      </header><div class="body flush">`;
    if(!learning.length)h+=`<div class="empty"><p class="muted">Nobody has training outstanding.</p></div>`;
    else{h+=`<ul class="list">`;
      learning.forEach(p=>{const all=trainOf(p.id),left=trLeft(p.id);
        h+=`<li><span class="av" style="width:32px;height:32px;font-size:12px">${esc(initials(p.name))}</span>
          <span style="flex:1;min-width:0"><b class="s5">${esc(p.name)}</b>
            <span class="s6 muted" style="display:block">${esc(p.dept)} · ${left} left of ${all.length}</span></span>
          <span class="bar" style="width:90px"><i style="width:${Math.round(trPct(p.id)*100)}%;background:var(--brand)"></i></span>
          <button class="btn ghost sm" onclick="go('setup');su={step:4}" title="Edit the plan">✎</button></li>`});
      h+=`</ul>`}
    h+=`</div></div>`;
  }

  return h+`</div>`;
}
function tickTraining(pid,id){
  const k=pid+'|'+id;
  S.trainingDone[k]?delete S.trainingDone[k]:S.trainingDone[k]=true;
  save();
  if(!trLeft(pid)){
    const boss=S.people.find(p=>p.role==='Admin'&&p.id!==pid);
    if(boss)sendNotice(boss.id,first(pid)+' has finished their training','All items ticked off.','notice');
    toast('Training complete. Nice.');
  }
  render();
}
const greet=()=>{const h=nowL().getUTCHours();return h<12?'Good morning,':h<17?'Good afternoon,':'Good evening,'};
function tickDuty(id){const t=today(),k=t+'|'+id;S.ticks[k]?delete S.ticks[k]:S.ticks[k]=true;save();render()}
function setStatus(id,s){
  const x=S.tasks.find(t=>t.id===id);if(!x)return;
  x.status=s;save();
  if(s==='Stuck'&&x.by!==S.me){
    sendNotice(x.by,first(S.me)+' is stuck on: '+x.title,'They marked it Stuck on the dashboard.','ping');
    toast('Marked Stuck. '+first(x.by)+' has been told.');
  }else toast('Updated to '+s);
  render();
}
function quickPing(to){
  modal(`<div class="card"><header><h3>Ping ${esc(nameOf(to))}</h3>
    <button class="btn ghost sm" onclick="modal('')">✕</button></header><div class="body">
    <form onsubmit="event.preventDefault();doQuickPing('${to}',this)">
      <label class="fld"><span>What do you need?</span>
        <input name="t" required autofocus placeholder="e.g. Can you send me the pricing sheet?"/></label>
      <div style="height:12px"></div>
      <label class="fld"><span>How urgent?</span></label>
      <div class="seg" id="lvl">
        <button type="button" onclick="pickLvl(this,'ping')" aria-pressed="true">🔔 Ring them</button>
        <button type="button" class="bad" onclick="pickLvl(this,'alarm')" aria-pressed="false">🚨 Keep ringing</button>
        <button type="button" onclick="pickLvl(this,'notice')" aria-pressed="false">💤 No sound</button>
      </div>
      <input type="hidden" name="lvl" value="ping"/>
      <button class="btn lg" style="margin-top:16px">Send</button>
    </form></div></div>`);
}
function pickLvl(btn,v){
  const wrap=btn.parentElement;
  [...wrap.children].forEach(b=>b.setAttribute('aria-pressed','false'));
  btn.setAttribute('aria-pressed','true');
  wrap.parentElement.querySelector('[name=lvl]').value=v;
}
function doQuickPing(to,f){
  sendNotice(to,f.t.value,'',f.lvl.value);
  modal('');toast(f.lvl.value==='notice'?'Sent quietly.':'Sent — '+first(to)+"'s screen is ringing.");
  render();
}

/* End-of-day close, folded into the dashboard (not a tab) */
function closeDay(){

  const duties=dutiesFor(a.id,t);
  const tasks=myTasks(a.id);
  modal(`<div class="card"><header><h3>Close my day</h3>
    <button class="btn ghost sm" onclick="modal('')">✕</button></header><div class="body">
    <form onsubmit="event.preventDefault();doClose(this)">

        <em>Leave empty if nothing is.</em>
        <input name="blocker" placeholder="What is stopping you?"/></label>
      <div style="height:10px"></div>
      <label class="fld"><span>Who can unblock it?</span>
        <select name="who"><option value="">— nobody / not stuck —</option>
        ${activePeople().filter(p=>p.id!==a.id).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}
        </select></label>
      <div style="height:10px"></div>
      <label class="fld"><span>Top 3 for tomorrow</span>
        <em>Pre-filled from your open work — edit if you like.</em>

      </label>

function doClose(f){
  const a=me(),t=today();
  S.closes=S.closes.filter(c=>!(c.who===a.id&&c.date===t));
  S.closes.push({who:a.id,date:t,done:doneCount(a.id,t),due:dutiesFor(a.id,t).length,
    blocker:f.blocker.value.trim(),unblocker:f.who.value,
    top3:[f.t0.value,f.t1.value,f.t2.value].filter(x=>x.trim()),at:new Date().toISOString()});
  if(f.blocker.value.trim()&&f.who.value){
    sendNotice(f.who.value,first(a.id)+' is blocked: '+f.blocker.value.trim(),
      'Raised in their end-of-day update.','ping');
  }
  save();modal('');toast('Day closed. Nice work.');render();
}

/* 2 · ASSIGN — hand work to a teammate */
let asg=null;
function assign(){
  const a=me();
  if(!asg)asg={to:'',title:'',note:'',due:addD(today(),1),priority:'Normal',ring:true};
  const mine=S.tasks.filter(t=>t.by===a.id&&t.status!=='Done').sort((x,y)=>String(x.due).localeCompare(String(y.due)));

  let h=`<div class="stack">
  <div><h1>Give work to someone</h1>
    <p class="muted">They see it on their dashboard straight away.</p></div>
  <div class="card"><div class="body stack" style="gap:16px">
    <div><label class="fld"><span>Who is doing it?</span></label>
      <div class="people">`;
  activePeople().forEach(p=>{
    h+=`<button class="pbtn" aria-pressed="${asg.to===p.id}" onclick="asg.to='${p.id}';render()">
      <span class="av">${esc(initials(p.name))}</span>
      <span><b>${esc(p.name)}${p.id===a.id?' (me)':''}</b><span>${esc(p.dept)} · ${myTasks(p.id).length} open</span></span>
    </button>`});
  h+=`</div></div>

    <label class="fld"><span>What needs doing?</span>
      <input value="${esc(asg.title)}" oninput="asg.title=this.value;syncAssign()" placeholder="Say it in one line"/></label>

    <label class="fld"><span>Any detail? <span class="muted" style="font-weight:400">(optional)</span></span>
      <textarea oninput="asg.note=this.value" placeholder="Links, context, what done looks like">${esc(asg.note)}</textarea></label>

    <div class="grid2">
      <label class="fld"><span>When is it due?</span>
        <input type="date" value="${asg.due}" oninput="asg.due=this.value"/></label>
      <div><label class="fld"><span>How important?</span></label>
        <div class="seg">
          ${['Low','Normal','Urgent'].map(p=>`<button class="${p==='Urgent'?'bad':''}" aria-pressed="${asg.priority===p}"
            onclick="asg.priority='${p}';render()">${p}</button>`).join('')}
        </div></div>
    </div>

    <label class="row" style="gap:10px;cursor:pointer">
      <input type="checkbox" ${asg.ring?'checked':''} onchange="asg.ring=this.checked"
        style="width:22px;height:22px"/>
      <span>Ring their screen so they notice now</span></label>

    <button class="btn lg" id="giveBtn" ${asg.to&&asg.title.trim()?'':'disabled'} onclick="doAssign()">
      ${asg.to?'Give it to '+esc(first(asg.to)):'Pick someone first'}</button>
  </div></div>`;

  h+=`<div class="card"><header><h3>What I have given out</h3>
    <span class="s5 muted">${mine.length} open</span></header><div class="body flush">`;
  if(!mine.length)h+=`<div class="empty"><p class="muted">Nothing outstanding.</p></div>`;
  else{h+=`<ul class="list">`;
    mine.forEach(x=>{const dl=daysLeft(x.due);
      h+=`<li><span class="av" style="width:32px;height:32px;font-size:12px;background:var(--steel-600)">${esc(initials(nameOf(x.owner)))}</span>
        <span style="flex:1;min-width:0">
          <b style="font-weight:600">${esc(x.title)}</b><br>
          <span class="s6 muted">${esc(first(x.owner))} · ${dl<0?`<b style="color:var(--attention)">${-dl}d late</b>`:'due '+esc(fmtShort(x.due))}</span>
        </span>
        <span class="pill ${x.status==='Stuck'?'c-bad':x.status==='Doing'?'c-brand':'c-idle'}">${esc(x.status)}</span>
        <button class="btn ghost sm" onclick="quickPing('${x.owner}')" title="Nudge">🔔</button></li>`});
    h+=`</ul>`}
  return h+`</div></div></div>`;
}
/* Typing must enable the button immediately — re-rendering here would steal
   the cursor, so the button is updated in place. */
function syncAssign(){
  const b=document.getElementById('giveBtn');if(!b)return;
  const ready=!!(asg.to&&asg.title.trim());
  b.disabled=!ready;
  b.textContent=asg.to?'Give it to '+first(asg.to):'Pick someone first';
}
function syncNotify(){
  const b=document.getElementById('sendBtn');if(!b)return;
  b.disabled=!nf.title.trim();
  b.textContent='Send to '+nameOf(nf.to);
}
function doAssign(){
  const a=me();
  const code='T-'+String(++S.seq).padStart(3,'0');
  S.tasks.unshift({id:uid('t'),code,title:asg.title.trim(),note:asg.note.trim(),owner:asg.to,by:a.id,
    due:asg.due,priority:asg.priority,status:'To do',at:new Date().toISOString()});
  if(asg.to!==a.id){
    sendNotice(asg.to,'New task from '+first(a.id)+': '+asg.title.trim(),
      (asg.note?asg.note+' · ':'')+'Due '+fmtShort(asg.due),
      asg.ring?(asg.priority==='Urgent'?'alarm':'ping'):'notice');
  }
  save();
  const who=first(asg.to);
  asg=null;toast('Sent to '+who+'.');render();
}

/* 3 · NOTIFY — message one person or the whole team */
let nf=null;
function notify(){
  const a=me();
  if(!nf)nf={to:'ALL',title:'',body:'',level:'ping'};
  const list=noticesFor(a.id);
  const sent=S.notices.filter(n=>n.from===a.id);

  let h=`<div class="stack">
  <div><h1>Notify the team</h1>
    <p class="muted">One person or everyone. Choose whether it rings.</p></div>

  <div class="card"><div class="body stack" style="gap:16px">
    <div><label class="fld"><span>Send to</span></label>
      <div class="people">
        <button class="pbtn" aria-pressed="${nf.to==='ALL'}" onclick="nf.to='ALL';render()">
          <span class="av" style="background:var(--navy-900)">ALL</span>
          <span><b>Everyone</b><span>${activePeople().length} people</span></span></button>`;
  activePeople().filter(p=>p.id!==a.id).forEach(p=>{
    h+=`<button class="pbtn" aria-pressed="${nf.to===p.id}" onclick="nf.to='${p.id}';render()">
      <span class="av">${esc(initials(p.name))}</span>
      <span><b>${esc(p.name)}</b><span>${esc(p.dept)}</span></span></button>`});
  h+=`</div></div>

    <label class="fld"><span>Message</span>
      <input value="${esc(nf.title)}" oninput="nf.title=this.value;syncNotify()"
        placeholder="e.g. Standup moved to 4pm"/></label>

    <label class="fld"><span>More detail <span class="muted" style="font-weight:400">(optional)</span></span>
      <textarea oninput="nf.body=this.value">${esc(nf.body)}</textarea></label>

    <div><label class="fld"><span>How should it arrive?</span></label>
      <div class="seg">
        <button aria-pressed="${nf.level==='notice'}" onclick="nf.level='notice';render()">💤 Quietly</button>
        <button aria-pressed="${nf.level==='ping'}" onclick="nf.level='ping';render()">🔔 Ring once</button>
        <button class="bad" aria-pressed="${nf.level==='alarm'}" onclick="nf.level='alarm';render()">🚨 Keep ringing until answered</button>
      </div>
      <p class="s6 muted" style="margin-top:8px">${
        nf.level==='alarm'?'Their screen takes over and the alarm keeps sounding — even on another tab — until they answer. Use it when you truly need someone now.'
        :nf.level==='ping'?'One chime plus a pop-up. Good for most things.'
        :'Appears in their list with no sound.'}</p>
    </div>

    <button class="btn lg" id="sendBtn" ${nf.title.trim()?'':'disabled'} onclick="doNotify()">
      Send to ${esc(nameOf(nf.to))}</button>
  </div></div>`;

  h+=`<div class="card"><header><h3>My messages</h3></header><div class="body flush">`;
  if(!list.length)h+=`<div class="empty"><p class="muted">Nothing yet.</p></div>`;
  else{h+=`<ul class="list">`;
    list.slice(0,25).forEach(n=>{
      const mineSent=n.from===a.id;
      const need=!mineSent&&n.level!=='notice'&&!(n.acks||[]).some(k=>k.who===a.id);
      h+=`<li style="cursor:pointer;flex-wrap:wrap" onclick="openNotice('${n.id}')">
        <span class="dot" style="background:${n.level==='alarm'?'var(--attention)':n.level==='ping'?'var(--brand)':'var(--steel-300)'}"></span>
        <span style="flex:1;min-width:180px">
          <b style="font-weight:600">${esc(n.title)}</b>
          ${need?' <span class="pill c-bad">needs your answer</span>':''}
          <br><span class="s6 muted">${mineSent?'you → '+esc(nameOf(n.to)):'from '+esc(nameOf(n.from))} · ${esc(ago(n.at))}
          ${(n.acks||[]).length?' · '+n.acks.length+' answered':''}</span>
        </span></li>`});
    h+=`</ul>`}
  h+=`</div></div>`;

  h+=`<p class="s6 muted" style="text-align:center">Answers appear under each message, so you can
    see who has picked it up. Pings ring on this computer and any other tab of it; reaching a
    teammate's own laptop needs the hosted version.</p>`;
  return h+`</div>`;
}
function doNotify(){
  const n=sendNotice(nf.to,nf.title.trim(),nf.body.trim(),nf.level);
  const to=nameOf(nf.to);
  nf=null;save();
  toast(n.level==='notice'?'Sent quietly to '+to:'Sent — '+to+(n.level==='alarm'?"'s screen is ringing until answered.":' has been rung.'));
  render();
}
function openNotice(id){
  const n=S.notices.find(x=>x.id===id);if(!n)return;
  n.read=n.read||[];if(!n.read.includes(S.me))n.read.push(S.me);save();
  const mineSent=n.from===S.me;
  const answered=(n.acks||[]).some(k=>k.who===S.me);
  modal(`<div class="card"><header><h3>${esc(n.title)}</h3>
    <button class="btn ghost sm" onclick="modal('')">✕</button></header><div class="body stack" style="gap:12px">
    <p class="s5 muted">${mineSent?'You → '+esc(nameOf(n.to)):'From '+esc(nameOf(n.from))} · ${esc(ago(n.at))}</p>
    ${n.body?`<p>${esc(n.body)}</p>`:''}
    ${(n.acks||[]).length?`<div class="stack" style="gap:7px">
      ${n.acks.map(k=>`<div class="mini"><span class="av" style="width:28px;height:28px;font-size:11px;background:var(--on-target)">${esc(initials(nameOf(k.who)))}</span>
        <span style="flex:1"><b class="s5">${esc(first(k.who))}</b> <span class="s5 muted">— ${esc(k.answer)}</span></span></div>`).join('')}
    </div>`:mineSent?'<p class="s5 muted">Nobody has answered yet.</p>':''}
    ${!mineSent&&!answered?`<div class="stack" style="gap:8px">
      <button class="btn ok" onclick="ackNotice('${n.id}','On it');modal('');toast('Answered');render()">✅ On it</button>
      <button class="btn sec" onclick="ackNotice('${n.id}','Give me 10 minutes');modal('');toast('Answered');render()">⏱️ Give me 10 min</button>
    </div>`:''}
    ${!mineSent&&answered?'<p class="s5" style="color:var(--on-target)">You answered this.</p>':''}
  </div></div>`);
}

/* 4 · SETUP — admin only. Sets the whole thing up before anyone else logs in. */

  if(!su)su={step:0,dept:'Sales'};

  let h=`<div class="stack" style="max-width:760px;margin:0 auto">

          ${list.map(d=>`<div class="mini"><span style="flex:1" class="s5">${esc(d.title)}</span>

          onchange="setSlot('${su.dept}','${r.id}','what',this.value)"/>
        <button class="btn ghost sm" onclick="delSlot('${su.dept}','${r.id}')">✕</button></div>`});
    h+=`</div>
      <div class="row">
        <form class="row" style="flex:1;gap:7px" onsubmit="event.preventDefault();addSlot('${su.dept}',this)">
          <input name="at" type="time" value="12:00" style="width:112px;height:38px;font-size:14px"/>
          <input name="what" placeholder="What happens then" style="flex:1;height:38px;font-size:14px"/>
          <button class="btn sec sm">Add</button></form>
        <button class="btn ghost sm" onclick="resetSched('${su.dept}')">Use the standard ${esc(su.dept)} day</button>
      </div>`;
  }

  /* 5 · Training — what a new joiner learns, per department */
  if(su.step===4){
    h+=`<p class="s5 muted">Anyone you add to a department automatically gets its training list on
      their dashboard, grouped by Day 1, Week 1 and Month 1. It disappears once they have ticked
      everything, and you can watch progress from the Today tab.</p>
      <div class="chips">${DEPTS.map(d=>`<button class="chip" aria-pressed="${su.dept===d}"
        onclick="su.dept='${d}';render()">${d}</button>`).join('')}</div>`;
    const rows=S.training[su.dept]||[];
    h+=`<div class="stack" style="gap:7px">`;
    ['Day 1','Week 1','Month 1'].forEach(g=>{
      const items=rows.filter(r=>r.when===g);if(!items.length)return;
      h+=`<b class="s6 up muted" style="margin-top:4px">${g}</b>`;
      items.forEach(r=>{
        h+=`<div class="mini">
          <input value="${esc(r.title)}" style="flex:1;height:36px;font-size:14px"
            onchange="setTrain('${su.dept}','${r.id}','title',this.value)"/>
          <select style="width:auto;height:36px;font-size:13px"
            onchange="setTrain('${su.dept}','${r.id}','when',this.value)">
            ${['Day 1','Week 1','Month 1'].map(w=>`<option ${r.when===w?'selected':''}>${w}</option>`).join('')}
          </select>
          <button class="btn ghost sm" onclick="delTrain('${su.dept}','${r.id}')">✕</button></div>`})});
    if(!rows.length)h+=`<p class="s5 muted">No training set for ${esc(su.dept)} yet.</p>`;
    h+=`</div>
      <div class="row">
        <form class="row" style="flex:1;gap:7px" onsubmit="event.preventDefault();addTrain('${su.dept}',this)">
          <select name="when" style="width:auto;height:38px;font-size:14px">
            <option>Day 1</option><option>Week 1</option><option>Month 1</option></select>
          <input name="title" placeholder="What they need to learn" style="flex:1;height:38px;font-size:14px"/>
          <button class="btn sec sm">Add</button></form>
        <button class="btn ghost sm" onclick="resetTrain('${su.dept}')">Use the standard ${esc(su.dept)} plan</button>
      </div>`;
  }

  if(su.step===5){
    const total=S.people.length,withTasks=S.people.filter(p=>(S.fixed[p.id]||[]).length).length;
    h+=`<div class="note">Everything below is ready. Team members do not need to set anything up —
      they open the link, pick their name, and their day is waiting for them.</div>
      <ul class="list" style="border:1px solid var(--hairline);border-radius:10px">
        <li><span style="flex:1">People on the dashboard</span><b>${total}</b></li>
        <li><span style="flex:1">People with daily tasks set</span><b>${withTasks}</b></li>
        <li><span style="flex:1">Departments with a schedule</span><b>${DEPTS.filter(d=>(S.schedules[d]||[]).length).length} of ${DEPTS.length}</b></li>
        <li><span style="flex:1">Departments with a training plan</span><b>${DEPTS.filter(d=>(S.training[d]||[]).length).length} of ${DEPTS.length}</b></li>
        <li><span style="flex:1">Admins</span><b>${S.people.filter(p=>p.role==='Admin').map(p=>p.name.split(' ')[0]).join(', ')||'—'}</b></li>
        <li><span style="flex:1">Alarm sound</span><b>${Alarm.ready?'On':'Not yet turned on'}</b></li>
      </ul>
      <div class="stack" style="gap:9px">
        <button class="btn lg" onclick="su=null;go('dash')">Open the dashboard</button>
        <button class="btn sec" onclick="sendNotice('ALL','The dashboard is ready','Pick your name at the top right and you will see your day.','ping');toast('Told everyone.')">
          Tell the team it is ready</button>
      </div>
      <div class="warnbox">Worth knowing: this single file keeps its data in the browser it is
        opened in. Pings ring on this computer and in any other tab or window of it — perfect for
        trying everything out and for a shared screen. To ring a teammate on <em>their</em> laptop,
        the hosted version needs to be running, which is the same product with a server behind it.</div>`;
  }

  h+=`<div class="row" style="justify-content:space-between;margin-top:6px">
      <button class="btn sec" ${su.step===0?'disabled':''} onclick="su.step--;render()">Back</button>
      ${su.step<5?`<button class="btn" onclick="su.step++;render()">Next</button>`:''}
    </div></div></div>`;

  h+=`<div class="card"><header><h3>Danger zone</h3></header><div class="body row">
    <button class="btn sec sm" onclick="wipeTeam()">Start from an empty team</button>
    <button class="btn sec sm" onclick="resetAll()">Reset back to the sample team</button>
  </div></div>`;
  return h+`</div>`;
}
function setRole(id,r){person(id).role=r;save();render()}
function removePerson(id){
  if(S.people.length<=1)return toast('You need at least one person.');
  if(!confirm('Remove '+nameOf(id)+'? Their tasks stay in the record.'))return;
  S.people=S.people.filter(p=>p.id!==id);
  if(S.me===id)S.me=S.people[0].id;
  save();render();
}
/* Adding someone sets their whole day up in one go: the department's daily
   tasks, its schedule, and its training plan. Nothing else for them to do. */
function addPerson(f){
  const id=uid('p'),dept=f.d.value,name=f.n.value.trim();
  S.people.push({id,name,dept,desig:f.j.value.trim()||dept,role:'Member',email:'',
    active:true,joined:today()});
  S.fixed[id]=(TEMPLATES[dept]||[]).slice(0,4).map(t=>({id:uid('d'),title:t,when:'Every working day'}));
  if(!(S.schedules[dept]||[]).length)S.schedules[dept]=mkSched(dept);
  if(!(S.training[dept]||[]).length)S.training[dept]=mkTrain(dept);
  save();f.reset();render();
  toast(name.split(' ')[0]+' is set up: '+S.fixed[id].length+' daily tasks, the '+dept
    +' schedule and '+(S.training[dept]||[]).length+' training items.');
}
/* Schedule editing */
function setSlot(d,id,k,v){const r=(S.schedules[d]||[]).find(x=>x.id===id);if(r){r[k]=v;
  S.schedules[d].sort((a,b)=>hhmm(a.at)-hhmm(b.at));save();render()}}
function delSlot(d,id){S.schedules[d]=(S.schedules[d]||[]).filter(x=>x.id!==id);save();render()}
function addSlot(d,f){
  if(!f.what.value.trim())return;
  S.schedules[d]=S.schedules[d]||[];
  S.schedules[d].push({id:uid('s'),at:f.at.value,what:f.what.value.trim()});
  S.schedules[d].sort((a,b)=>hhmm(a.at)-hhmm(b.at));
  save();f.reset();render();
}
function resetSched(d){S.schedules[d]=mkSched(d);save();render();toast('Standard '+d+' day restored.')}
/* Training editing */
function setTrain(d,id,k,v){const r=(S.training[d]||[]).find(x=>x.id===id);if(r){r[k]=v;save();render()}}
function delTrain(d,id){S.training[d]=(S.training[d]||[]).filter(x=>x.id!==id);save();render()}
function addTrain(d,f){
  if(!f.title.value.trim())return;
  S.training[d]=S.training[d]||[];
  S.training[d].push({id:uid('r'),when:f.when.value,title:f.title.value.trim()});
  save();f.reset();render();
}
function resetTrain(d){S.training[d]=mkTrain(d);save();render();toast('Standard '+d+' plan restored.')}
function addDuty(pid,f){
  const t=f.t.value.trim();if(!t)return;
  S.fixed[pid]=S.fixed[pid]||[];
  if(S.fixed[pid].length>=5)return toast('Five is the ceiling.');
  S.fixed[pid].push({id:uid('d'),title:t,when:'Every working day'});
  save();f.reset();render();
}
function delDuty(pid,did){S.fixed[pid]=(S.fixed[pid]||[]).filter(d=>d.id!==did);save();render()}
function setWhen(pid,did,w){const d=(S.fixed[pid]||[]).find(x=>x.id===did);if(d)d.when=w;save()}
function fillTemplate(pid){
  const p=person(pid);
  S.fixed[pid]=(TEMPLATES[p.dept]||[]).slice(0,4).map(t=>({id:uid('d'),title:t,when:'Every working day'}));
  save();render();toast('Added the '+p.dept+' set — edit anything you like.');
}
function wipeTeam(){
  if(!confirm('Remove every person except you, and clear all tasks?'))return;
  const keep=me();
  S={...seed(),people:[{...keep,role:'Admin'}],fixed:{[keep.id]:[]},tasks:[],notices:[],
     ticks:{},closes:[],trainingDone:{},me:keep.id,seq:0,setupDone:false,
     company:S.company,settings:S.settings,schedules:S.schedules,training:S.training};
  save();su={step:1,dept:'Sales'};render();
}
function resetAll(){
  if(!confirm('Reset everything back to the sample team?'))return;
  S=seed();save();su=null;go('dash');
}

/* ── shell ────────────────────────────────────────────────────────────── */
let route='dash';
function go(r,arg){route=r;if(r==='notify'&&arg==='new')nf={to:'ALL',title:'',body:'',level:'ping'};
  window.scrollTo(0,0);render()}
function modal(h){document.getElementById('modal').innerHTML=h?
  `<div class="sheet" onclick="if(event.target===this)modal('')">${h}</div>`:''}
function toast(m){const el=document.getElementById('toast');
  el.innerHTML=`<div class="toast">${esc(m)}</div>`;
  clearTimeout(toast.t);toast.t=setTimeout(()=>el.innerHTML='',3000)}
function whoDialog(){
  return `<div class="card"><header><h3>Who are you?</h3>
    <button class="btn ghost sm" onclick="modal('')">✕</button></header><div class="body">
    <p class="s5 muted" style="margin-bottom:12px">Pick your name. Everything below switches to your day.</p>
    <div class="people">
    ${activePeople().map(p=>`<button class="pbtn" aria-pressed="${p.id===S.me}" onclick="setMe('${p.id}')">
      <span class="av">${esc(initials(p.name))}</span>
      <span><b>${esc(p.name)}</b><span>${esc(p.desig||p.dept)}${p.role==='Admin'?' · admin':''}</span></span>
    </button>`).join('')}
    </div>
    <div class="row" style="margin-top:14px;justify-content:space-between">
      <button class="btn ghost sm" onclick="toggleTheme()">Light / dark</button>
      <button class="btn ghost sm" onclick="modal('');go('setup')">${isAdmin()?'Setup':''}</button>
    </div></div></div>`;
}
function setMe(id){S.me=id;asg=null;nf=null;su=null;save();modal('');go('dash');
  const pend=noticesFor(id).find(n=>n.level!=='notice'&&n.from!==id&&!(n.acks||[]).some(k=>k.who===id));
  if(pend)setTimeout(()=>maybeRing(pend),400)}
function toggleTheme(){
  const el=document.documentElement,c=el.getAttribute('data-theme');
  const n=c==='dark'?'light':c==='light'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'light':'dark');
  el.setAttribute('data-theme',n);try{localStorage.setItem('5c-theme',n)}catch(e){}
}
function render(){
  const a=me();
  document.getElementById('coName').textContent=S.company.name;
  document.getElementById('coSub').textContent=S.company.sub;
  const n=unread(a.id);
  const tabs=[['dash','Today','🏠'],['assign','Give work','📋'],['notify','Notify','🔔']];
  if(isAdmin(a))tabs.push(['setup','Setup','⚙️']);
  document.getElementById('tabs').innerHTML=tabs.map(([k,l,i])=>
    `<button ${route===k?'aria-current="page"':''} onclick="go('${k}')">
      <span class="ic" aria-hidden="true">${i}</span>${l}
      ${k==='notify'&&n?`<span class="badge">${n}</span>`:''}</button>`).join('');
  document.getElementById('who').innerHTML=
    `<span class="av">${esc(initials(a.name))}</span><span>${esc(a.name.split(' ')[0])}</span>`;
  document.getElementById('who').onclick=()=>modal(whoDialog());
  document.getElementById('app').innerHTML=
    route==='dash'?dash():route==='assign'?assign():route==='notify'?notify():setup();
  renderEnableBar();
}

/* ── boot ─────────────────────────────────────────────────────────────── */
try{const t=localStorage.getItem('5c-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}
load();
Alarm.originalTitle=document.title;
render();
/* If sound was enabled before, restore it on the first tap anywhere. */
try{
  if(localStorage.getItem('5c-sound')==='on'){
    const once=()=>{Alarm.enable();document.removeEventListener('pointerdown',once)};
    document.addEventListener('pointerdown',once);
  }
}catch(e){}
/* Ring anything already waiting for this person. */
setTimeout(()=>{
  const p=noticesFor(S.me).find(n=>n.level!=='notice'&&n.from!==S.me&&!(n.acks||[]).some(k=>k.who===S.me));
  if(p&&(Date.now()-new Date(p.at))<3600000)maybeRing(p);
},700);
/* Keep relative times fresh. */
setInterval(()=>{if(!Alarm.current&&!document.getElementById('modal').innerHTML)render()},60000);
</script>
